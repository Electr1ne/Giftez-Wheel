<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Лавина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* Лента прошлых иксов */
    .av-history-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 1px;
      scrollbar-width: none;
    }
    .av-history-bar::-webkit-scrollbar {
      display: none;
    }
    .av-hist-chip {
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.2px;
      border: 1px solid var(--border-strong);
      background: var(--panel-2);
      color: var(--ice-bright);
    }
    .av-hist-chip.zero {
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }
    .av-hist-chip.low {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.32);
      color: #bae6fd;
    }
    .av-hist-chip.mid {
      background: rgba(129, 140, 248, 0.18);
      border-color: rgba(129, 140, 248, 0.45);
      color: #c7d2fe;
    }
    .av-hist-chip.high {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.5);
      color: #fde047;
    }

    /* Главная арена Лавины */
    .avalanche-arena {
      position: relative;
      height: 248px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 18%, rgba(56, 189, 248, 0.25) 0%, transparent 62%),
        linear-gradient(180deg, #0b162c 0%, #070c18 100%);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .avalanche-arena.waiting {
      border-color: rgba(125, 211, 252, 0.42);
      box-shadow: inset 0 0 36px rgba(56, 189, 248, 0.14);
    }
    .avalanche-arena.running {
      border-color: rgba(56, 189, 248, 0.72);
      box-shadow: inset 0 0 46px rgba(56, 189, 248, 0.25);
    }
    .avalanche-arena.danger {
      border-color: rgba(251, 191, 36, 0.72);
      box-shadow: inset 0 0 48px rgba(251, 191, 36, 0.24);
      animation: avDangerPulse 0.36s infinite alternate;
    }
    @keyframes avDangerPulse {
      from { transform: scale(1); }
      to { transform: scale(1.01); }
    }
    .avalanche-arena.crashed {
      border-color: rgba(244, 63, 94, 0.85);
      box-shadow: inset 0 0 54px rgba(244, 63, 94, 0.42);
      animation: avCrashShake 0.34s ease;
    }
    .avalanche-arena.won {
      border-color: rgba(52, 211, 153, 0.85);
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.3), inset 0 0 40px rgba(16, 185, 129, 0.22);
    }
    @keyframes avCrashShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-5px, 5px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, 4px); }
      80% { transform: translate(4px, -2px); }
    }

    /* Canvas восходящего снега и гор */
    #avSnowLiftCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Волна снежного подъёма */
    .avalanche-wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background: linear-gradient(0deg, rgba(56, 189, 248, 0.22) 0%, rgba(125, 211, 252, 0.06) 45%, transparent 100%);
      pointer-events: none;
      transform: translateY(100%);
      transition: transform 0.22s linear;
      z-index: 1;
    }
    .avalanche-arena.crashed .avalanche-wave {
      transform: translateY(0%) !important;
      background: linear-gradient(180deg, rgba(244, 63, 94, 0.42) 0%, rgba(244, 63, 94, 0.14) 65%, transparent 100%);
    }

    /* Верхний бейдж статуса внутри арены */
    .av-stage-pill {
      position: absolute;
      top: 11px;
      left: 12px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(7, 10, 18, 0.65);
      border: 1px solid rgba(148, 197, 255, 0.24);
      font-size: 10.5px;
      font-weight: 800;
      color: #e0f2fe;
    }
    .av-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: avDotBlink 1s infinite alternate;
    }
    .avalanche-arena.crashed .av-live-dot {
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
    }
    @keyframes avDotBlink {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }

    /* Центральный множитель / отсчёт */
    .avalanche-mult {
      position: relative;
      z-index: 3;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -1.4px;
      background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.02;
      transition: transform 0.12s ease;
    }
    .avalanche-arena.waiting .avalanche-mult {
      font-size: 58px;
      background: linear-gradient(180deg, #ffffff 0%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: avCountPop 0.95s ease infinite;
    }
    @keyframes avCountPop {
      0% { transform: scale(1.12); opacity: 0.85; }
      40% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.92; }
    }
    .avalanche-arena.running .avalanche-mult {
      transform: scale(1.03);
    }
    .avalanche-arena.crashed .avalanche-mult {
      background: linear-gradient(180deg, #fda4af 0%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .avalanche-arena.won .avalanche-mult {
      background: linear-gradient(180deg, #a7f3d0 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .avalanche-status {
      position: relative;
      z-index: 3;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 8px;
      max-width: 90%;
    }

    /* Полоса прогресса отсчёта 5..1 */
    .av-countdown-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 3;
    }
    .av-countdown-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.1s linear;
    }

    /* Кнопка ставки в очередь на следующий раунд */
    .btn-main.queued-btn {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      box-shadow: 0 8px 22px rgba(124, 58, 237, 0.34);
    }
    .btn-main.cashout-green-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.36);
    }

    .auto-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 13px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .auto-switch-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1px solid var(--border-strong);
      background: #090e1c;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .auto-switch-btn.on {
      background: var(--ice-soft);
      border-color: var(--ice-bright);
      color: var(--ice-bright);
    }

    /* Список игроков раунда */
    .av-players-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 310px;
      overflow-y: auto;
    }
    .av-player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 13px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .av-player-row.is-me {
      border-color: rgba(125, 211, 252, 0.45);
      background: rgba(56, 189, 248, 0.08);
    }
    .av-player-row.is-won {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.1);
    }
    .av-player-row.is-lost {
      border-color: rgba(244, 63, 94, 0.42);
      background: rgba(244, 63, 94, 0.09);
    }
    .av-player-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .av-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a, #312e81);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #e0f2fe;
      flex-shrink: 0;
    }
    .av-player-name {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .av-player-bet {
      font-size: 11px;
      color: var(--muted);
    }
    .av-player-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
    }
    .av-badge-playing {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      font-size: 11px;
    }
    .av-badge-won {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #34d399;
      font-size: 11.5px;
      font-weight: 900;
    }
    .av-badge-lost {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fb7185;
      font-size: 11.5px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="sec-row fade-in">
      <a class="btn-mini-refresh" href="index.html">&lt; Назад</a>
      <span class="pill-ice">ИГРА «ЛАВИНА»</span>
    </div>

    <!-- Прошлые иксы -->
    <div class="av-history-bar fade-in" id="avHistoryBar"></div>

    <div class="section-card fade-in">
      <div class="avalanche-arena waiting" id="avalancheArena">
        <canvas id="avSnowLiftCanvas"></canvas>
        <div class="avalanche-wave" id="avWave"></div>

        <div class="av-stage-pill" id="avStagePill">
          <span class="av-live-dot"></span>
          <span id="avStageLabel">ПОДГОТОВКА РАУНДА</span>
        </div>

        <div class="avalanche-mult" id="avMultText">5</div>
        <div class="avalanche-status" id="avStatusText">Старт через 5 сек. Успей сделать ставку!</div>

        <div class="av-countdown-track" id="avCountdownTrack">
          <div class="av-countdown-fill" id="avCountdownFill"></div>
        </div>
      </div>

      <div>
        <div class="row-sub" style="margin-bottom:4px;">Ставка (★)</div>
        <input type="number" class="field-input" id="avBetInput" min="1" max="2000" value="10" />
      </div>

      <div class="chips-row-3">
        <button type="button" class="btn-soft" data-av-bet="5">5 ★</button>
        <button type="button" class="btn-soft" data-av-bet="25">25 ★</button>
        <button type="button" class="btn-soft" data-av-bet="50">50 ★</button>
      </div>

      <div class="auto-toggle-row">
        <div>
          <div class="row-title">Авто-выход</div>
          <div class="row-sub">Забирать автоматически на заданном x</div>
        </div>
        <button type="button" class="auto-switch-btn" id="btnToggleAutoCash">ВЫКЛ</button>
      </div>

      <div id="autoCashConfigBox" style="display:none;flex-direction:column;gap:8px;">
        <input type="number" class="field-input" id="avTargetInput" min="1.05" max="25" step="0.05" value="1.5" placeholder="Множитель авто-выхода (напр. 1.5)" />
        <div class="chips-row-3">
          <button type="button" class="btn-soft" data-av-mult="1.3">1.30x</button>
          <button type="button" class="btn-soft" data-av-mult="2.0">2.00x</button>
          <button type="button" class="btn-soft" data-av-mult="3.5">3.50x</button>
        </div>
      </div>

      <button type="button" class="btn-main" id="btnAvalancheAction">Поставить 10 ★</button>
    </div>

    <!-- Список игроков текущего раунда -->
    <div class="section-card fade-in">
      <div class="card-head">
        <h2>Игроки в раунде</h2>
        <span class="pill-ice" id="avPlayersCountBadge">0 игроков</span>
      </div>
      <div class="av-players-list" id="avPlayersList"></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
        }
      });
      if (!session) return;
      appState = session.state;

      const arena = document.getElementById("avalancheArena");
      const waveEl = document.getElementById("avWave");
      const multEl = document.getElementById("avMultText");
      const statusEl = document.getElementById("avStatusText");
      const stageLabelEl = document.getElementById("avStageLabel");
      const countdownTrack = document.getElementById("avCountdownTrack");
      const countdownFill = document.getElementById("avCountdownFill");
      const historyBar = document.getElementById("avHistoryBar");
      const playersListEl = document.getElementById("avPlayersList");
      const playersCountEl = document.getElementById("avPlayersCountBadge");

      const btnAction = document.getElementById("btnAvalancheAction");
      const betInput = document.getElementById("avBetInput");
      const btnAutoToggle = document.getElementById("btnToggleAutoCash");
      const autoBox = document.getElementById("autoCashConfigBox");
      const targetInput = document.getElementById("avTargetInput");

      let autoCashEnabled = false;
      let autoTarget = 1.5;

      // Состояние ставок текущего пользователя
      // currentBet: { bet, status: 'playing' | 'won' | 'lost', cashoutMult, payout, roundId }
      let currentBet = null;
      // queuedBet: { bet, autoEnabled, autoMult } — ставка на СЛЕДУЮЩИЙ раунд
      let queuedBet = null;
      let cashingOut = false;

      // Общее состояние синхронизированного раунда
      let roundPhase = "waiting"; // 'waiting' | 'running' | 'crashed'
      let activeRoundId = "";
      let currentMult = 0.0;
      let crashMult = 1.0;
      let lastCountdownNum = null;
      let lastTickBucket = -1;
      let historyMults = [1.84, 0.00, 4.12, 1.29, 0.45, 7.60, 2.15, 0.00, 3.08, 1.62];
      let roundPlayers = [];

      const myUser = tg?.initDataUnsafe?.user;
      const myName = myUser?.username ? `@${myUser.username}` : (myUser?.first_name || "Вы");

      /* =========================================================
         1. ПЛАВНАЯ КРИВАЯ РАЗГОНА ОТ 0.00x
         - 0.00x .. 3.00x: очень медленный и плавный разгон
         - 3.00x .. 7.00x: чуть быстрее
         - 7.00x .. 15.00x: умеренно быстрее
         - > 15.00x: динамичный рост
      ========================================================= */
      function computeMultiplierAtElapsed(sec) {
        if (sec <= 0) return 0.0;
        // Фаза 1: 0.00x -> 3.00x за 15 секунд (очень плавно: ~0.12x -> 0.28x/сек)
        if (sec <= 15.0) {
          const t = sec / 15.0;
          const val = 3.0 * (0.62 * t + 0.38 * t * t);
          return Number(val.toFixed(2));
        }
        // Фаза 2: 3.00x -> 7.00x за следующие 10 секунд (~0.40x/сек)
        const s2 = sec - 15.0;
        if (s2 <= 10.0) {
          const t = s2 / 10.0;
          const val = 3.0 + 4.0 * (0.78 * t + 0.22 * t * t);
          return Number(val.toFixed(2));
        }
        // Фаза 3: 7.00x -> 15.00x за следующие 11 секунд (~0.72x/сек)
        const s3 = s2 - 10.0;
        if (s3 <= 11.0) {
          const t = s3 / 11.0;
          const val = 7.0 + 8.0 * (0.8 * t + 0.2 * t * t);
          return Number(val.toFixed(2));
        }
        // Фаза 4: свыше 15.00x
        const s4 = s3 - 11.0;
        const val = 15.0 + s4 * 1.15 + Math.pow(s4, 1.35) * 0.2;
        return Number(Math.min(100, val).toFixed(2));
      }

      function computeDurationForCrash(targetCrash) {
        if (targetCrash <= 0.0) return 0.35; // Краш на 0.00x
        let lo = 0;
        let hi = 90;
        for (let i = 0; i < 28; i++) {
          const mid = (lo + hi) * 0.5;
          if (computeMultiplierAtElapsed(mid) < targetCrash) lo = mid;
          else hi = mid;
        }
        return (lo + hi) * 0.5;
      }

      /* =========================================================
         2. ДЕТЕРМИНИРОВАННЫЙ ОБЩИЙ ЦИКЛ РАУНДОВ ДЛЯ ВСЕХ ИГРОКОВ
         (если сервер ещё не отдаёт /api/avalanche_state)
      ========================================================= */
      function seededRand(seed) {
        let x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function generateCrashForSeed(seed) {
        const r = seededRand(seed);
        // ~10% шанс краша на 0.00x
        if (r < 0.10) return 0.00;
        // ~24% шанс раннего схода до 1.25x
        if (r < 0.34) return Number((0.15 + seededRand(seed + 1) * 1.10).toFixed(2));
        // ~38% шанс среднего раунда 1.25x .. 3.20x
        if (r < 0.72) return Number((1.25 + seededRand(seed + 2) * 1.95).toFixed(2));
        // ~20% шанс 3.20x .. 8.50x
        if (r < 0.92) return Number((3.20 + seededRand(seed + 3) * 5.30).toFixed(2));
        // ~8% шанс высокого икса 8.50x .. 22.00x
        return Number((8.50 + seededRand(seed + 4) * 13.50).toFixed(2));
      }

      const BOT_NICKS = [
        "@snow_fox", "@ice_king", "@moroz_77", "@vanya_star", "@lednik",
        "@nord_wolf", "@kate_winter", "@dima_pro", "@sneg_ovik", "@elena_vip",
        "@frost_byte", "@lucky_bear", "@alex_top", "@alina_ice"
      ];

      function buildSimulatedPlayers(seed, roundCrash) {
        const count = 4 + Math.floor(seededRand(seed + 10) * 5); // 4..8 игроков
        const list = [];
        for (let i = 0; i < count; i++) {
          const nick = BOT_NICKS[(seed + i * 3) % BOT_NICKS.length];
          const betChoices = [5, 10, 15, 20, 25, 35, 50, 75, 100];
          const bet = betChoices[Math.floor(seededRand(seed + 20 + i) * betChoices.length)];
          const wantTarget = Number((1.15 + seededRand(seed + 40 + i) * 3.4).toFixed(2));
          const willWin = roundCrash > 0 && roundCrash >= wantTarget;
          list.push({
            id: `bot_${seed}_${i}`,
            name: nick,
            bet,
            targetMult: wantTarget,
            willWin,
            status: "playing",
            cashoutMult: 0,
            payout: 0,
            isMe: false
          });
        }
        return list;
      }

      function buildInitialHistory(currentEpochIdx) {
        const arr = [];
        for (let k = 1; k <= 10; k++) {
          arr.push(generateCrashForSeed(currentEpochIdx - k));
        }
        return arr;
      }

      /* =========================================================
         3. АНИМАЦИЯ ВОСХОДЯЩЕГО СНЕЖНОГО ПОТОКА (CANVAS)
      ========================================================= */
      const liftCanvas = document.getElementById("avSnowLiftCanvas");
      const liftCtx = liftCanvas.getContext("2d");
      let liftW = 360;
      let liftH = 248;

      function resizeLiftCanvas() {
        const rect = arena.getBoundingClientRect();
        liftW = liftCanvas.width = Math.max(200, Math.floor(rect.width));
        liftH = liftCanvas.height = Math.max(160, Math.floor(rect.height));
      }
      resizeLiftCanvas();
      window.addEventListener("resize", resizeLiftCanvas);

      const snowParticles = Array.from({ length: 48 }, () => ({
        x: Math.random() * 420,
        y: Math.random() * 260,
        r: 1.2 + Math.random() * 2.8,
        speed: 0.6 + Math.random() * 1.4,
        drift: -0.4 + Math.random() * 0.8,
        alpha: 0.25 + Math.random() * 0.55
      }));

      let lastFrameTs = performance.now();
      function renderSnowLift(now) {
        const dt = Math.min(0.05, (now - lastFrameTs) / 1000);
        lastFrameTs = now;

        liftCtx.clearRect(0, 0, liftW, liftH);

        // Скорость подъёма зависит от фазы и текущего икса
        let liftMultiplier = 0.35;
        if (roundPhase === "running") {
          liftMultiplier = 1.4 + Math.min(8.5, currentMult * 0.65);
        } else if (roundPhase === "crashed") {
          liftMultiplier = -2.8; // При краше снег обрушивается вниз
        }

        // Лёгкий световой столб подъёма в центре при раунде
        if (roundPhase === "running") {
          const beamAlpha = Math.min(0.24, 0.06 + currentMult * 0.015);
          const grad = liftCtx.createLinearGradient(0, liftH, 0, 0);
          grad.addColorStop(0, `rgba(56, 189, 248, ${beamAlpha})`);
          grad.addColorStop(0.65, `rgba(129, 140, 248, ${beamAlpha * 0.5})`);
          grad.addColorStop(1, "rgba(56, 189, 248, 0)");
          liftCtx.fillStyle = grad;
          liftCtx.fillRect(0, 0, liftW, liftH);
        }

        // Частицы снега, летящие вверх (подъём)
        for (const p of snowParticles) {
          p.y -= p.speed * 58 * liftMultiplier * dt;
          p.x += p.drift * 22 * dt;

          if (p.y < -8) {
            p.y = liftH + 6;
            p.x = Math.random() * liftW;
          } else if (p.y > liftH + 8) {
            p.y = -6;
            p.x = Math.random() * liftW;
          }
          if (p.x < 0) p.x = liftW;
          if (p.x > liftW) p.x = 0;

          liftCtx.beginPath();
          if (roundPhase === "running" && currentMult >= 1.8) {
            // Вытянутые снежные шлейфы при разгоне
            const streakLen = Math.min(18, 4 + currentMult * 1.4);
            liftCtx.strokeStyle = `rgba(224, 242, 254, ${p.alpha})`;
            liftCtx.lineWidth = p.r * 0.85;
            liftCtx.lineCap = "round";
            liftCtx.moveTo(p.x, p.y);
            liftCtx.lineTo(p.x - p.drift * 2, p.y + streakLen);
            liftCtx.stroke();
          } else {
            liftCtx.fillStyle = roundPhase === "crashed"
              ? `rgba(253, 164, 175, ${p.alpha})`
              : `rgba(224, 242, 254, ${p.alpha})`;
            liftCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            liftCtx.fill();
          }
        }

        requestAnimationFrame(renderSnowLift);
      }
      requestAnimationFrame(renderSnowLift);

      /* =========================================================
         4. ОТРИСОВКА ИСТОРИИ И СПИСКА ИГРОКОВ
      ========================================================= */
      function renderHistoryBar() {
        historyBar.innerHTML = historyMults
          .slice(0, 12)
          .map((m) => {
            const val = Number(m || 0);
            let cls = "low";
            if (val <= 0) cls = "zero";
            else if (val >= 5) cls = "high";
            else if (val >= 2) cls = "mid";
            return `<span class="av-hist-chip ${cls}">${val.toFixed(2)}x</span>`;
          })
          .join("");
      }

      function renderPlayersList() {
        const merged = [];
        if (currentBet && currentBet.roundId === activeRoundId) {
          merged.push({
            id: "me_active",
            name: `${myName} (Вы)`,
            bet: currentBet.bet,
            status: currentBet.status,
            cashoutMult: currentBet.cashoutMult,
            payout: currentBet.payout,
            isMe: true
          });
        }
        for (const p of roundPlayers) {
          merged.push(p);
        }

        playersCountEl.textContent = `${merged.length} игр.`;

        if (!merged.length) {
          playersListEl.innerHTML = `<div class="empty-box" style="padding:14px;">Ожидаем ставки игроков на раунд...</div>`;
          return;
        }

        playersListEl.innerHTML = merged
          .map((p) => {
            let rowCls = p.isMe ? "is-me" : "";
            let rightHtml = `<span class="av-badge-playing">В игре</span>`;

            if (p.status === "won") {
              rowCls += " is-won";
              rightHtml = `<span class="av-badge-won">+${p.payout} ★ · ${Number(p.cashoutMult).toFixed(2)}x</span>`;
            } else if (p.status === "lost") {
              rowCls += " is-lost";
              rightHtml = `<span class="av-badge-lost">0.00x · -${p.bet} ★</span>`;
            }

            const initial = escapeHtml(String(p.name || "И").replace(/^@/, "").charAt(0).toUpperCase());

            return `
              <div class="av-player-row ${rowCls}">
                <div class="av-player-left">
                  <div class="av-avatar">${initial}</div>
                  <div style="min-width:0;">
                    <div class="av-player-name">${escapeHtml(p.name)}</div>
                    <div class="av-player-bet">Ставка: ${p.bet} ★</div>
                  </div>
                </div>
                <div class="av-player-right">${rightHtml}</div>
              </div>
            `;
          })
          .join("");
      }

      /* =========================================================
         5. УПРАВЛЕНИЕ КНОПКОЙ СТАВКИ / ОЧЕРЕДИ / ВЫВОДА
      ========================================================= */
      function syncActionButton() {
        const inputBet = Math.max(1, Math.floor(Number(betInput.value || 10)));

        // 1. Игрок участвует в ТЕКУЩЕМ активном раунде и ещё не забрал
        if (roundPhase === "running" && currentBet && currentBet.roundId === activeRoundId && currentBet.status === "playing") {
          const livePayout = Math.floor(currentBet.bet * currentMult);
          btnAction.disabled = cashingOut || currentMult <= 0.01;
          btnAction.className = "btn-main cashout-green-btn";
          btnAction.textContent = cashingOut
            ? "Забираем..."
            : `Забрать (${livePayout} ★ · ${currentMult.toFixed(2)}x)`;
          return;
        }

        // 2. Идёт ожидание (5..1) и ставка на этот раунд уже принята
        if (roundPhase === "waiting" && currentBet && currentBet.roundId === activeRoundId) {
          btnAction.disabled = true;
          btnAction.className = "btn-main";
          btnAction.textContent = `Ставка ${currentBet.bet} ★ принята — ждём старт`;
          return;
        }

        // 3. Во время раунда или краша — игрок НЕ может поставить в текущий раунд, ставит в очередь на СЛЕДУЮЩИЙ
        if (roundPhase === "running" || roundPhase === "crashed") {
          if (queuedBet) {
            btnAction.disabled = false;
            btnAction.className = "btn-main queued-btn";
            btnAction.textContent = `В очереди на след. раунд: ${queuedBet.bet} ★ (Отменить)`;
          } else {
            btnAction.disabled = false;
            btnAction.className = "btn-main";
            btnAction.textContent = `Поставить на след. раунд (${inputBet} ★)`;
          }
          return;
        }

        // 4. Фаза ожидания (5..1), можно поставить на текущий стартующий раунд
        btnAction.disabled = false;
        btnAction.className = "btn-main";
        btnAction.textContent = `Поставить ${inputBet} ★`;
      }

      btnAutoToggle.onclick = () => {
        autoCashEnabled = !autoCashEnabled;
        btnAutoToggle.textContent = autoCashEnabled ? "ВКЛ" : "ВЫКЛ";
        btnAutoToggle.classList.toggle("on", autoCashEnabled);
        autoBox.style.display = autoCashEnabled ? "flex" : "none";
      };

      document.querySelectorAll("[data-av-bet]").forEach((btn) => {
        btn.onclick = () => {
          betInput.value = btn.getAttribute("data-av-bet");
          syncActionButton();
        };
      });

      document.querySelectorAll("[data-av-mult]").forEach((btn) => {
        btn.onclick = () => {
          targetInput.value = btn.getAttribute("data-av-mult");
        };
      });

      betInput.oninput = syncActionButton;

      async function placeBetForRound(targetRoundId, betAmount, autoOn, autoMultVal) {
        if (!tg?.initData) {
          toast("Открой игру в Telegram");
          return false;
        }
        const avail = Number(appState?.stars_balance || 0);
        if (avail < betAmount) {
          toast("Недостаточно звёзд на балансе");
          return false;
        }

        try {
          const r = await fetch(apiUrl("/api/avalanche_start"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              bet_stars: betAmount,
              round_id: targetRoundId,
              auto_enabled: autoOn,
              auto_mult: autoMultVal
            })
          });
          const d = await r.json();
          if (!d.ok) {
            toast(d.message || "Не удалось принять ставку");
            return false;
          }

          appState.stars_balance = d.stars_balance;
          appState.wager_left = d.wager_left;
          appState.withdrawable_stars = d.withdrawable_stars;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          currentBet = {
            roundId: targetRoundId,
            serverRoundId: d.round_id || targetRoundId,
            bet: betAmount,
            autoEnabled: autoOn,
            autoMult: autoMultVal,
            status: "playing",
            cashoutMult: 0,
            payout: 0
          };
          renderPlayersList();
          syncActionButton();
          toast(`Ставка ${betAmount} ★ принята в раунд!`);
          return true;
        } catch (_) {
          toast("Ошибка сети при ставке");
          return false;
        }
      }

      async function performCashout(multToClaim) {
        if (cashingOut || !currentBet || currentBet.status !== "playing") return;
        if (multToClaim <= 0.01) return;

        cashingOut = true;
        syncActionButton();

        const claimMult = Number(multToClaim.toFixed(2));
        const estPayout = Math.max(1, Math.round(currentBet.bet * claimMult));

        try {
          const r = await fetch(apiUrl("/api/avalanche_cashout"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              round_id: currentBet.serverRoundId || activeRoundId,
              mult: claimMult
            })
          });
          const d = await r.json();
          cashingOut = false;

          if (!d.ok) {
            toast(d.message || "Не успел забрать до схода");
            syncActionButton();
            return;
          }

          appState.stars_balance = d.stars_balance;
          appState.wager_left = d.wager_left;
          appState.withdrawable_stars = d.withdrawable_stars;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          currentBet.status = "won";
          currentBet.cashoutMult = Number(d.mult || claimMult);
          currentBet.payout = Number(d.payout || estPayout);

          arena.classList.add("won");
          statusEl.textContent = `Вы забрали +${currentBet.payout} ★ на ${currentBet.cashoutMult.toFixed(2)}x!`;
          playWin();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          toast(`Забрано ${currentBet.cashoutMult.toFixed(2)}x (+${currentBet.payout} ★)!`);

          renderPlayersList();
          syncActionButton();
        } catch (_) {
          cashingOut = false;
          toast("Ошибка сети");
          syncActionButton();
        }
      }

      btnAction.onclick = async () => {
        const betVal = Math.max(1, Math.floor(Number(betInput.value || 10)));
        const autoVal = autoCashEnabled ? Math.max(1.05, Number(targetInput.value || 1.5)) : 0;

        // Если в активном раунде — забираем выигрыш
        if (roundPhase === "running" && currentBet && currentBet.roundId === activeRoundId && currentBet.status === "playing") {
          await performCashout(currentMult);
          return;
        }

        // Если раунд идёт или уже крашнулся — ставим/отменяем очередь на СЛЕДУЮЩИЙ раунд
        if (roundPhase === "running" || roundPhase === "crashed") {
          if (queuedBet) {
            queuedBet = null;
            toast("Ставка на следующий раунд отменена");
          } else {
            const avail = Number(appState?.stars_balance || 0);
            if (avail < betVal) {
              toast("Недостаточно звёзд на балансе");
              return;
            }
            queuedBet = { bet: betVal, autoEnabled: autoCashEnabled, autoMult: autoVal };
            toast(`Ставка ${betVal} ★ поставлена в очередь на следующий раунд`);
          }
          syncActionButton();
          return;
        }

        // Если фаза ожидания (5..1) — ставим сразу в текущий стартующий раунд
        if (roundPhase === "waiting") {
          if (currentBet && currentBet.roundId === activeRoundId) return;
          btnAction.disabled = true;
          await placeBetForRound(activeRoundId, betVal, autoCashEnabled, autoVal);
        }
      };

      /* =========================================================
         6. ГЛАВНЫЙ ЦИКЛ СИНХРОНИЗАЦИИ ОБЩЕГО РАУНДА (5..4..3..2..1 -> ПОЛЁТ -> КРАШ)
      ========================================================= */
      const WAIT_SEC = 5.0;
      const CRASH_PAUSE_SEC = 3.2;
      let prevEpochIdx = -1;

      function tickSharedRound() {
        const nowSec = Date.now() / 1000;
        // Средняя длина одного полного цикла ~22 сек, детерминированно привязана к времени
        // чтобы все игроки, зашедшие в игру одновременно, видели один и тот же раунд
        const SLOT_LEN = 24.0;
        const epochIdx = Math.floor(nowSec / SLOT_LEN);
        const slotOffset = nowSec - epochIdx * SLOT_LEN;

        const rId = `round_${epochIdx}`;
        const targetCrash = generateCrashForSeed(epochIdx);
        const flightDuration = computeDurationForCrash(targetCrash);
        const activeFlightLen = Math.min(SLOT_LEN - WAIT_SEC - CRASH_PAUSE_SEC, flightDuration);
        const effectiveCrash = targetCrash <= 0
          ? 0.0
          : computeMultiplierAtElapsed(activeFlightLen);

        // Переход на новый раунд
        if (epochIdx !== prevEpochIdx) {
          prevEpochIdx = epochIdx;
          activeRoundId = rId;
          crashMult = effectiveCrash;
          lastCountdownNum = null;
          lastTickBucket = -1;

          if (historyMults.length === 0) {
            historyMults = buildInitialHistory(epochIdx);
          }
          renderHistoryBar();

          roundPlayers = buildSimulatedPlayers(epochIdx, effectiveCrash);
          if (currentBet && currentBet.roundId !== rId) {
            currentBet = null;
          }

          // Если была очередь со старого раунда — автоматически принимаем ставку в новый раунд
          if (queuedBet) {
            const q = queuedBet;
            queuedBet = null;
            placeBetForRound(rId, q.bet, q.autoEnabled, q.autoMult);
          }

          renderPlayersList();
        }

        // ФАЗА 1: ОЖИДАНИЕ И ОТСЧЁТ 5.. 4.. 3.. 2.. 1..
        if (slotOffset < WAIT_SEC) {
          roundPhase = "waiting";
          currentMult = 0.0;
          const left = Math.max(0.01, WAIT_SEC - slotOffset);
          const countNum = Math.ceil(left); // 5, 4, 3, 2, 1

          arena.className = "avalanche-arena waiting";
          stageLabelEl.textContent = "СТАРТ ЧЕРЕЗ";
          multEl.textContent = `${countNum}`;
          statusEl.textContent = `Приём ставок на раунд · старт через ${countNum} сек.`;
          waveEl.style.transform = "translateY(100%)";

          countdownTrack.style.display = "block";
          countdownFill.style.width = `${Math.min(100, (slotOffset / WAIT_SEC) * 100)}%`;

          if (countNum !== lastCountdownNum) {
            lastCountdownNum = countNum;
            playTick();
          }

          syncActionButton();
          requestAnimationFrame(tickSharedRound);
          return;
        }

        countdownTrack.style.display = "none";

        // ФАЗА 2: РАУНД ИДЁТ (ПЛАВНЫЙ РАЗГОН ОТ 0.00x)
        const flightElapsed = slotOffset - WAIT_SEC;
        if (flightElapsed < activeFlightLen && effectiveCrash > 0) {
          roundPhase = "running";
          currentMult = computeMultiplierAtElapsed(flightElapsed);

          const hasWon = currentBet && currentBet.roundId === rId && currentBet.status === "won";
          arena.className = `avalanche-arena running${hasWon ? " won" : ""}${currentMult >= 2.8 ? " danger" : ""}`;
          stageLabelEl.textContent = "ПОДЪЁМ ЛАВИНЫ";
          multEl.textContent = `${currentMult.toFixed(2)}x`;

          if (hasWon) {
            statusEl.textContent = `Вы забрали +${currentBet.payout} ★ (${currentBet.cashoutMult.toFixed(2)}x) · лавина летит дальше`;
          } else if (currentBet && currentBet.roundId === rId && currentBet.status === "playing") {
            statusEl.textContent = "Жми «Забрать», пока лавина не сошла!";
          } else {
            statusEl.textContent = "Раунд идёт · ставка сейчас пойдёт на следующий раунд";
          }

          // Плавный подъём снежной волны
          const waveRise = Math.max(12, 92 - currentMult * 11);
          waveEl.style.transform = `translateY(${waveRise}%)`;

          // Авто-выход игрока
          if (
            currentBet &&
            currentBet.roundId === rId &&
            currentBet.status === "playing" &&
            currentBet.autoEnabled &&
            currentBet.autoMult > 0 &&
            currentMult >= currentBet.autoMult
          ) {
            performCashout(currentBet.autoMult);
          }

          // Обновление статусов остальных игроков в списке
          let playersDirty = false;
          for (const p of roundPlayers) {
            if (p.status === "playing" && p.willWin && currentMult >= p.targetMult) {
              p.status = "won";
              p.cashoutMult = p.targetMult;
              p.payout = Math.max(1, Math.round(p.bet * p.targetMult));
              playersDirty = true;
            }
          }
          if (playersDirty) renderPlayersList();

          // Звуковой тик по мере роста икса
          const bucket = Math.floor(currentMult * 5);
          if (bucket !== lastTickBucket) {
            lastTickBucket = bucket;
            playTick();
          }

          syncActionButton();
          requestAnimationFrame(tickSharedRound);
          return;
        }

        // ФАЗА 3: КРАШ ЛАВИНЫ (включая 0.00x)
        if (roundPhase !== "crashed") {
          roundPhase = "crashed";
          currentMult = effectiveCrash;

          // Записываем икс в ленту истории
          if (historyMults[0] !== effectiveCrash || historyMults.length === 0) {
            historyMults.unshift(effectiveCrash);
            if (historyMults.length > 14) historyMults.pop();
            renderHistoryBar();
          }

          // Все, кто не успел забрать — проиграли (красным и x0)
          if (currentBet && currentBet.roundId === rId && currentBet.status === "playing") {
            currentBet.status = "lost";
            currentBet.cashoutMult = 0;
            currentBet.payout = 0;
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          }

          for (const p of roundPlayers) {
            if (p.status === "playing") {
              p.status = "lost";
              p.cashoutMult = 0;
              p.payout = 0;
            }
          }
          renderPlayersList();
        }

        arena.className = "avalanche-arena crashed";
        stageLabelEl.textContent = effectiveCrash <= 0 ? "МГНОВЕННЫЙ СХОД" : "ЛАВИНА СОШЛА";
        multEl.textContent = `${effectiveCrash.toFixed(2)}x`;
        statusEl.textContent = effectiveCrash <= 0
          ? "Лавина обрушилась на 0.00x! Следующий раунд через пару секунд..."
          : `Лавина накрыла на ${effectiveCrash.toFixed(2)}x · готовим новый раунд...`;

        syncActionButton();
        requestAnimationFrame(tickSharedRound);
      }

      requestAnimationFrame(tickSharedRound);
    })();
  </script>
</body>
</html>
