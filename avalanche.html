<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Лавина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* Лента прошлых иксов */
    .av-history-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 1px;
      min-height: 28px;
      scrollbar-width: none;
    }
    .av-history-bar::-webkit-scrollbar {
      display: none;
    }
    .av-hist-chip {
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.2px;
      border: 1px solid var(--border-strong);
      background: var(--panel-2);
      color: var(--ice-bright);
    }
    .av-hist-chip.zero {
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }
    .av-hist-chip.low {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.32);
      color: #bae6fd;
    }
    .av-hist-chip.mid {
      background: rgba(129, 140, 248, 0.18);
      border-color: rgba(129, 140, 248, 0.45);
      color: #c7d2fe;
    }
    .av-hist-chip.high {
      background: rgba(251, 191, 36, 0.18);
      border-color: rgba(251, 191, 36, 0.5);
      color: #fde047;
    }

    /* Главная арена Лавины */
    .avalanche-arena {
      position: relative;
      height: 256px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 18%, rgba(56, 189, 248, 0.22) 0%, transparent 64%),
        linear-gradient(180deg, #0b162c 0%, #070c18 100%);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .avalanche-arena.waiting {
      border-color: rgba(125, 211, 252, 0.42);
      box-shadow: inset 0 0 36px rgba(56, 189, 248, 0.14);
    }
    .avalanche-arena.running {
      border-color: rgba(56, 189, 248, 0.72);
      box-shadow: inset 0 0 46px rgba(56, 189, 248, 0.25);
    }
    .avalanche-arena.danger {
      border-color: rgba(251, 191, 36, 0.72);
      box-shadow: inset 0 0 48px rgba(251, 191, 36, 0.24);
      animation: avDangerPulse 0.45s ease-in-out infinite alternate;
    }
    @keyframes avDangerPulse {
      from { transform: scale(1); }
      to { transform: scale(1.01); }
    }
    .avalanche-arena.crashed {
      border-color: rgba(244, 63, 94, 0.85);
      box-shadow: inset 0 0 54px rgba(244, 63, 94, 0.38);
      animation: avCrashShake 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .avalanche-arena.won {
      border-color: rgba(52, 211, 153, 0.85);
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.3), inset 0 0 40px rgba(16, 185, 129, 0.22);
    }
    @keyframes avCrashShake {
      0%, 100% { transform: translate(0, 0); }
      18% { transform: translate(-5px, 6px); }
      36% { transform: translate(5px, -4px); }
      54% { transform: translate(-4px, 4px); }
      72% { transform: translate(4px, -2px); }
    }

    /* Canvas графика подъёма, восходящего снега и обвала */
    #avSnowLiftCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Волна снежного подъёма во время полёта */
    .avalanche-wave {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      background: linear-gradient(0deg, rgba(56, 189, 248, 0.18) 0%, rgba(125, 211, 252, 0.04) 45%, transparent 100%);
      pointer-events: none;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1;
    }

    /* Поток обвалившегося сверху снега с плавной уборкой */
    .av-snow-collapse {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transform: translateY(-100%);
      background: linear-gradient(
        180deg,
        rgba(241, 245, 249, 0.72) 0%,
        rgba(224, 242, 254, 0.38) 38%,
        rgba(186, 230, 253, 0.1) 75%,
        transparent 100%
      );
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s ease;
    }
    .avalanche-arena.crashed .av-snow-collapse {
      opacity: 1;
      transform: translateY(0%);
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    /* Пышные многослойные сугробы с плавным таянием / уборкой вниз */
    .av-snowdrifts {
      position: absolute;
      left: -6%;
      right: -6%;
      bottom: -8px;
      height: 92px;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transform: translateY(105%) scaleY(0.75);
      transform-origin: bottom center;
      transition: transform 0.72s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.68s ease;
    }
    .avalanche-arena.crashed .av-snowdrifts {
      opacity: 1;
      transform: translateY(0%) scaleY(1);
      transition: transform 0.44s cubic-bezier(0.16, 1, 0.3, 1) 0.04s, opacity 0.28s ease;
    }
    .av-snowdrifts svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Верхний бейдж статуса внутри арены */
    .av-stage-pill {
      position: absolute;
      top: 11px;
      left: 12px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(7, 10, 18, 0.72);
      border: 1px solid rgba(148, 197, 255, 0.28);
      font-size: 10.5px;
      font-weight: 800;
      color: #e0f2fe;
    }
    .av-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: avDotBlink 1.2s ease-in-out infinite alternate;
    }
    .avalanche-arena.crashed .av-live-dot {
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
    }
    @keyframes avDotBlink {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* Центральный множитель / отсчёт */
    .avalanche-mult {
      position: relative;
      z-index: 4;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -1.4px;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.02;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 4px 16px rgba(7, 10, 18, 0.75));
    }
    .avalanche-arena.waiting .avalanche-mult {
      font-size: 58px;
      background: linear-gradient(180deg, #ffffff 0%, #bae6fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: avCountPop 1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes avCountPop {
      0% { transform: scale(1.08); opacity: 0.85; }
      45% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.97); opacity: 0.94; }
    }
    .avalanche-arena.running .avalanche-mult {
      transform: scale(1.02);
    }
    .avalanche-arena.crashed .avalanche-mult {
      background: linear-gradient(180deg, #fda4af 0%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 12px rgba(7, 10, 18, 0.85));
    }
    .avalanche-arena.won .avalanche-mult {
      background: linear-gradient(180deg, #a7f3d0 0%, #34d399 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .avalanche-status {
      position: relative;
      z-index: 4;
      font-size: 12px;
      font-weight: 800;
      color: #e2e8f0;
      margin-top: 8px;
      max-width: 90%;
      text-shadow: 0 2px 10px rgba(7, 10, 18, 0.85);
    }

    /* Полоса прогресса отсчёта 5..1 */
    .av-countdown-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 4;
    }
    .av-countdown-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }

    .btn-main.cashout-green-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.36);
    }

    .field-input:disabled,
    .btn-soft:disabled,
    .auto-switch-btn:disabled {
      opacity: 0.52;
      cursor: not-allowed;
      pointer-events: none;
    }

    .auto-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 13px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .auto-switch-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: 99px;
      border: 1px solid var(--border-strong);
      background: #090e1c;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .auto-switch-btn.on {
      background: var(--ice-soft);
      border-color: var(--ice-bright);
      color: var(--ice-bright);
    }

    /* Список реальных игроков раунда */
    .av-players-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 310px;
      overflow-y: auto;
    }
    .av-player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 13px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      transition: border-color 0.25s ease, background 0.25s ease;
    }
    .av-player-row.is-me {
      border-color: rgba(125, 211, 252, 0.45);
      background: rgba(56, 189, 248, 0.08);
    }
    .av-player-row.is-won {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.1);
    }
    .av-player-row.is-lost {
      border-color: rgba(244, 63, 94, 0.42);
      background: rgba(244, 63, 94, 0.09);
    }
    .av-player-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .av-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a, #312e81);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #e0f2fe;
      flex-shrink: 0;
    }
    .av-player-name {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .av-player-bet {
      font-size: 11px;
      color: var(--muted);
    }
    .av-player-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 800;
    }
    .av-badge-playing {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
      font-size: 11px;
    }
    .av-badge-won {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #34d399;
      font-size: 11.5px;
      font-weight: 900;
    }
    .av-badge-lost {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: #fb7185;
      font-size: 11.5px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="sec-row fade-in">
      <a class="btn-mini-refresh" href="index.html">&lt; Назад</a>
      <span class="pill-ice">ИГРА «ЛАВИНА»</span>
    </div>

    <!-- Прошлые иксы реальных раундов -->
    <div class="av-history-bar fade-in" id="avHistoryBar"></div>

    <div class="section-card fade-in">
      <div class="avalanche-arena waiting" id="avalancheArena">
        <canvas id="avSnowLiftCanvas"></canvas>
        <div class="avalanche-wave" id="avWave"></div>
        <div class="av-snow-collapse" id="avSnowCollapse"></div>

        <!-- Пышные многослойные сугробы при обвале лавины -->
        <div class="av-snowdrifts" id="avSnowdrifts">
          <svg viewBox="0 0 440 96" preserveAspectRatio="none" fill="none">
            <path d="M-10 96 L-10 46 Q45 14 115 36 Q185 56 255 24 Q335 -6 450 38 L450 96 Z" fill="rgba(186, 230, 253, 0.72)"/>
            <path d="M-10 96 L-10 56 Q65 26 145 50 Q225 70 305 34 Q380 12 450 52 L450 96 Z" fill="rgba(224, 242, 254, 0.88)"/>
            <path d="M-10 96 L-10 66 Q50 40 125 62 Q205 82 285 48 Q365 24 450 64 L450 96 Z" fill="#f8fafc"/>
          </svg>
        </div>

        <div class="av-stage-pill" id="avStagePill">
          <span class="av-live-dot"></span>
          <span id="avStageLabel">ПОДГОТОВКА РАУНДА</span>
        </div>

        <div class="avalanche-mult" id="avMultText">5</div>
        <div class="avalanche-status" id="avStatusText">Старт через 5 сек. Успей сделать ставку!</div>

        <div class="av-countdown-track" id="avCountdownTrack">
          <div class="av-countdown-fill" id="avCountdownFill"></div>
        </div>
      </div>

      <div>
        <div class="row-sub" style="margin-bottom:4px;">Ставка (★)</div>
        <input type="number" class="field-input" id="avBetInput" min="1" max="2000" value="10" />
      </div>

      <div class="chips-row-3">
        <button type="button" class="btn-soft" data-av-bet="5">5 ★</button>
        <button type="button" class="btn-soft" data-av-bet="25">25 ★</button>
        <button type="button" class="btn-soft" data-av-bet="50">50 ★</button>
      </div>

      <div class="auto-toggle-row">
        <div>
          <div class="row-title">Авто-выход</div>
          <div class="row-sub">Забирать автоматически на заданном x</div>
        </div>
        <button type="button" class="auto-switch-btn" id="btnToggleAutoCash">ВЫКЛ</button>
      </div>

      <div id="autoCashConfigBox" style="display:none;flex-direction:column;gap:8px;">
        <input type="number" class="field-input" id="avTargetInput" min="1.05" max="25" step="0.05" value="1.5" placeholder="Множитель авто-выхода (напр. 1.5)" />
        <div class="chips-row-3">
          <button type="button" class="btn-soft" data-av-mult="1.3">1.30x</button>
          <button type="button" class="btn-soft" data-av-mult="2.0">2.00x</button>
          <button type="button" class="btn-soft" data-av-mult="3.5">3.50x</button>
        </div>
      </div>

      <button type="button" class="btn-main" id="btnAvalancheAction">Поставить 10 ★</button>
    </div>

    <!-- Список реальных игроков текущего раунда -->
    <div class="section-card fade-in">
      <div class="card-head">
        <h2>Игроки в раунде</h2>
        <span class="pill-ice" id="avPlayersCountBadge">0 игр.</span>
      </div>
      <div class="av-players-list" id="avPlayersList">
        <div class="empty-box" style="padding:14px;">В текущем раунде пока нет ставок</div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
        }
      });
      if (!session) return;
      appState = session.state;

      const arena = document.getElementById("avalancheArena");
      const waveEl = document.getElementById("avWave");
      const multEl = document.getElementById("avMultText");
      const statusEl = document.getElementById("avStatusText");
      const stageLabelEl = document.getElementById("avStageLabel");
      const countdownTrack = document.getElementById("avCountdownTrack");
      const countdownFill = document.getElementById("avCountdownFill");
      const historyBar = document.getElementById("avHistoryBar");
      const playersListEl = document.getElementById("avPlayersList");
      const playersCountEl = document.getElementById("avPlayersCountBadge");

      const btnAction = document.getElementById("btnAvalancheAction");
      const betInput = document.getElementById("avBetInput");
      const btnAutoToggle = document.getElementById("btnToggleAutoCash");
      const autoBox = document.getElementById("autoCashConfigBox");
      const targetInput = document.getElementById("avTargetInput");

      let autoCashEnabled = false;

      let currentBet = null;
      let queuedBet = null;
      let isPlacingBet = false;
      let cashingOut = false;

      let roundPhase = "waiting"; // 'waiting' | 'running' | 'crashed'
      let activeRoundId = "";
      let currentMult = 0.0;
      let currentFlightElapsed = 0.0;
      let crashMult = 1.0;
      let lastCountdownNum = null;
      let lastTickBucket = -1;

      let serverAvalancheData = null;
      let historyMults = [];
      let lastResetAt = 0;
      let realRoundPlayers = [];
      let graphPoints = [];

      const myUser = tg?.initDataUnsafe?.user;
      const myUserId = Number(myUser?.id || 0);
      const myName = myUser?.username ? `@${myUser.username}` : (myUser?.first_name || "Игрок");

      /* =========================================================
         1. УСКОРЕННЫЙ РАЗГОН ОТ 0.00x (СОВПАДАЕТ С MAIN.PY)
      ========================================================= */
      function computeMultiplierAtElapsed(sec) {
        if (sec <= 0) return 0.0;
        const val = 0.085 * sec + 0.014 * sec * sec + 0.0011 * sec * sec * sec;
        return Number(Math.min(100, val).toFixed(2));
      }

      function computeDurationForCrash(targetCrash) {
        if (targetCrash <= 0.0) return 0.45;
        let lo = 0;
        let hi = 90;
        for (let i = 0; i < 36; i++) {
          const mid = (lo + hi) * 0.5;
          if (computeMultiplierAtElapsed(mid) < targetCrash) lo = mid;
          else hi = mid;
        }
        return (lo + hi) * 0.5;
      }

      function seededRand(seed) {
        const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function computeFallbackCrash(seed) {
        const r = seededRand(seed);
        if (r < 0.14) return 0.00;
        if (r < 0.72) return Number((1.05 + seededRand(seed + 1) * 0.94).toFixed(2));
        if (r < 0.92) return Number((2.00 + seededRand(seed + 2) * 1.60).toFixed(2));
        return Number((3.60 + seededRand(seed + 3) * 8.00).toFixed(2));
      }

      async function pollRealAvalancheState() {
        if (!tg?.initData) return;
        try {
          const r = await fetch(apiUrl("/api/avalanche_state"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: tg.initData })
          });
          if (!r.ok) return;
          const d = await r.json();
          if (!d || !d.ok) return;

          serverAvalancheData = d;
          const srvResetAt = Number(d.history_reset_at || 0);
          if (srvResetAt > lastResetAt) {
            lastResetAt = srvResetAt;
            historyMults = [];
          }
          if (Array.isArray(d.history)) {
            historyMults = d.history.map((x) => Number(x || 0));
            renderHistoryBar();
          }
          if (Array.isArray(d.players)) {
            realRoundPlayers = d.players.map((p) => ({
              userId: Number(p.user_id || 0),
              name: p.username ? `@${String(p.username).replace(/^@+/, "")}` : (p.name || "Игрок"),
              bet: Number(p.bet_stars || p.bet || 0),
              status: p.status || "playing",
              cashoutMult: Number(p.cashout_mult || 0),
              payout: Number(p.payout || 0)
            }));
            renderPlayersList();
          }
        } catch (_) {}
      }

      pollRealAvalancheState();
      setInterval(pollRealAvalancheState, 1200);

      /* =========================================================
         2. ИНТЕРАКТИВНЫЙ ГРАФИК ПОДЪЁМА + СНЕГ + ПЛАВНАЯ УБОРКА СУГРОБОВ
      ========================================================= */
      const liftCanvas = document.getElementById("avSnowLiftCanvas");
      const liftCtx = liftCanvas.getContext("2d");
      let liftW = 360;
      let liftH = 256;

      function resizeLiftCanvas() {
        const rect = arena.getBoundingClientRect();
        liftW = liftCanvas.width = Math.max(200, Math.floor(rect.width));
        liftH = liftCanvas.height = Math.max(160, Math.floor(rect.height));
      }
      resizeLiftCanvas();
      window.addEventListener("resize", resizeLiftCanvas);

      const snowParticles = Array.from({ length: 64 }, () => ({
        x: Math.random() * 420,
        y: Math.random() * 260,
        r: 1.1 + Math.random() * 2.6,
        speed: 0.45 + Math.random() * 1.15,
        phase: Math.random() * Math.PI * 2,
        swayAmp: 6 + Math.random() * 14,
        alpha: 0.22 + Math.random() * 0.55
      }));

      let crashClumps = [];
      function spawnSnowCollapseClumps() {
        crashClumps = Array.from({ length: 34 }, () => ({
          x: Math.random() * liftW,
          y: -15 - Math.random() * 90,
          r: 4 + Math.random() * 9,
          vy: 190 + Math.random() * 240,
          vx: -25 + Math.random() * 50,
          alpha: 0.85,
          settled: false
        }));
      }

      function drawAscentGraph() {
        if (graphPoints.length < 2 && roundPhase !== "running") return;

        const padL = 16;
        const padR = 26;
        const padT = 38;
        const padB = 22;
        const plotW = Math.max(60, liftW - padL - padR);
        const plotH = Math.max(60, liftH - padT - padB);

        const maxT = Math.max(5.5, currentFlightElapsed * 1.12);
        const maxM = Math.max(2.2, currentMult * 1.18);

        // Тонкая горизонтальная сетка уровней (1.0x, 2.0x и т.д.)
        liftCtx.save();
        liftCtx.font = "700 10px -apple-system, sans-serif";
        liftCtx.textAlign = "right";
        const step = maxM > 6 ? 2 : 1;
        for (let lvl = step; lvl < maxM; lvl += step) {
          const gy = liftH - padB - (lvl / maxM) * plotH;
          if (gy < padT + 4 || gy > liftH - padB - 4) continue;
          liftCtx.strokeStyle = "rgba(148, 197, 255, 0.10)";
          liftCtx.lineWidth = 1;
          liftCtx.setLineDash([4, 4]);
          liftCtx.beginPath();
          liftCtx.moveTo(padL, gy);
          liftCtx.lineTo(liftW - padR, gy);
          liftCtx.stroke();

          liftCtx.fillStyle = "rgba(140, 162, 194, 0.55)";
          liftCtx.fillText(`${lvl.toFixed(1)}x`, liftW - 6, gy + 3);
        }
        liftCtx.setLineDash([]);

        // Линия авто-выхода игрока, если включена
        const targetAuto = autoCashEnabled ? Number(targetInput.value || 0) : 0;
        if (targetAuto > 0 && targetAuto <= maxM && roundPhase === "running") {
          const ay = liftH - padB - (targetAuto / maxM) * plotH;
          liftCtx.strokeStyle = "rgba(52, 211, 153, 0.45)";
          liftCtx.lineWidth = 1.2;
          liftCtx.setLineDash([5, 3]);
          liftCtx.beginPath();
          liftCtx.moveTo(padL, ay);
          liftCtx.lineTo(liftW - padR, ay);
          liftCtx.stroke();
          liftCtx.setLineDash([]);
        }

        if (graphPoints.length >= 2) {
          const isCrash = roundPhase === "crashed";
          const isWon = currentBet && currentBet.roundId === activeRoundId && currentBet.status === "won";

          const pts = graphPoints.map((pt) => ({
            x: padL + (pt.t / maxT) * plotW,
            y: liftH - padB - (pt.m / maxM) * plotH
          }));

          // Градиентная заливка под графиком подъёма
          const areaGrad = liftCtx.createLinearGradient(0, padT, 0, liftH - padB);
          if (isCrash) {
            areaGrad.addColorStop(0, "rgba(244, 63, 94, 0.30)");
            areaGrad.addColorStop(1, "rgba(244, 63, 94, 0.0)");
          } else if (isWon) {
            areaGrad.addColorStop(0, "rgba(52, 211, 153, 0.32)");
            areaGrad.addColorStop(1, "rgba(52, 211, 153, 0.0)");
          } else {
            areaGrad.addColorStop(0, "rgba(56, 189, 248, 0.34)");
            areaGrad.addColorStop(1, "rgba(56, 189, 248, 0.0)");
          }

          liftCtx.beginPath();
          liftCtx.moveTo(pts[0].x, liftH - padB);
          for (const p of pts) liftCtx.lineTo(p.x, p.y);
          liftCtx.lineTo(pts[pts.length - 1].x, liftH - padB);
          liftCtx.closePath();
          liftCtx.fillStyle = areaGrad;
          liftCtx.fill();

          // Неоновая кривая подъёма
          liftCtx.beginPath();
          liftCtx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) {
            liftCtx.lineTo(pts[i].x, pts[i].y);
          }
          liftCtx.strokeStyle = isCrash ? "#fb7185" : (isWon ? "#34d399" : "#38bdf8");
          liftCtx.lineWidth = 3;
          liftCtx.lineCap = "round";
          liftCtx.lineJoin = "round";
          liftCtx.shadowColor = isCrash ? "rgba(244, 63, 94, 0.7)" : "rgba(56, 189, 248, 0.85)";
          liftCtx.shadowBlur = 12;
          liftCtx.stroke();
          liftCtx.shadowBlur = 0;

          // Светящийся маркер вершины лавины
          const tip = pts[pts.length - 1];
          liftCtx.beginPath();
          liftCtx.arc(tip.x, tip.y, 7.5, 0, Math.PI * 2);
          liftCtx.fillStyle = isCrash ? "rgba(244, 63, 94, 0.28)" : "rgba(125, 211, 252, 0.32)";
          liftCtx.fill();

          liftCtx.beginPath();
          liftCtx.arc(tip.x, tip.y, 4, 0, Math.PI * 2);
          liftCtx.fillStyle = "#ffffff";
          liftCtx.fill();
        }
        liftCtx.restore();
      }

      let smoothLiftFactor = 0.25;
      let lastFrameTs = performance.now();

      function renderSnowLift(now) {
        const dt = Math.min(0.05, (now - lastFrameTs) / 1000);
        lastFrameTs = now;

        liftCtx.clearRect(0, 0, liftW, liftH);

        // Отрисовка интерактивного графика подъёма во время раунда и краша
        if (roundPhase === "running" || roundPhase === "crashed") {
          drawAscentGraph();
        }

        let targetLift = 0.25;
        if (roundPhase === "running") {
          targetLift = 0.95 + Math.min(6.8, currentMult * 0.7);
        } else if (roundPhase === "crashed") {
          targetLift = -2.2;
        }
        smoothLiftFactor += (targetLift - smoothLiftFactor) * Math.min(1, dt * 3.6);

        const timeSec = now / 1000;
        for (const p of snowParticles) {
          p.y -= p.speed * 46 * smoothLiftFactor * dt;
          p.x += Math.sin(timeSec * 1.3 + p.phase) * p.swayAmp * dt;

          if (p.y < -10) {
            p.y = liftH + 8;
            p.x = Math.random() * liftW;
          } else if (p.y > liftH + 10) {
            p.y = -8;
            p.x = Math.random() * liftW;
          }
          if (p.x < 0) p.x = liftW;
          if (p.x > liftW) p.x = 0;

          liftCtx.beginPath();
          if (roundPhase === "running" && smoothLiftFactor > 1.25) {
            const tail = Math.min(16, (smoothLiftFactor - 1.0) * 3.4);
            liftCtx.strokeStyle = `rgba(224, 242, 254, ${p.alpha * 0.85})`;
            liftCtx.lineWidth = p.r * 0.8;
            liftCtx.lineCap = "round";
            liftCtx.moveTo(p.x, p.y);
            liftCtx.lineTo(p.x, p.y + tail);
            liftCtx.stroke();
          } else {
            liftCtx.fillStyle = `rgba(224, 242, 254, ${p.alpha})`;
            liftCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            liftCtx.fill();
          }
        }

        // Падение комьев снега и их плавное таяние/уборка при смене фазы
        if (crashClumps.length > 0) {
          for (const c of crashClumps) {
            if (roundPhase === "crashed") {
              c.y += c.vy * dt;
              c.x += c.vx * dt;
              if (c.y >= liftH - 16) {
                c.y = liftH - 16;
                c.vy = 0;
                c.vx = 0;
              }
            } else {
              // Плавная уборка снега вниз и растворение в начале нового раунда
              c.y += 42 * dt;
              c.alpha = Math.max(0, c.alpha - 1.6 * dt);
            }
            if (c.alpha > 0.01) {
              liftCtx.beginPath();
              liftCtx.fillStyle = `rgba(248, 250, 252, ${c.alpha})`;
              liftCtx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
              liftCtx.fill();
            }
          }
          if (roundPhase !== "crashed" && crashClumps.every((c) => c.alpha <= 0.01)) {
            crashClumps = [];
          }
        }

        requestAnimationFrame(renderSnowLift);
      }
      requestAnimationFrame(renderSnowLift);

      /* =========================================================
         3. ОТРИСОВКА ИСТОРИИ И СПИСКА ТОЛЬКО РЕАЛЬНЫХ ИГРОКОВ
      ========================================================= */
      function renderHistoryBar() {
        if (!historyMults.length) {
          historyBar.innerHTML = `<span class="av-hist-chip low">История раундов появится после старта</span>`;
          return;
        }
        historyBar.innerHTML = historyMults
          .slice(0, 14)
          .map((m) => {
            const val = Number(m || 0);
            let cls = "low";
            if (val <= 0) cls = "zero";
            else if (val >= 5) cls = "high";
            else if (val >= 2) cls = "mid";
            return `<span class="av-hist-chip ${cls}">${val.toFixed(2)}x</span>`;
          })
          .join("");
      }

      function renderPlayersList() {
        const list = [];

        const meOnServer = realRoundPlayers.some((p) => myUserId > 0 && p.userId === myUserId);
        if (currentBet && currentBet.roundId === activeRoundId && !meOnServer) {
          list.push({
            userId: myUserId,
            name: `${myName} (Вы)`,
            bet: currentBet.bet,
            status: currentBet.status,
            cashoutMult: currentBet.cashoutMult,
            payout: currentBet.payout,
            isMe: true
          });
        }

        for (const p of realRoundPlayers) {
          const isMe = myUserId > 0 && p.userId === myUserId;
          if (isMe && currentBet && currentBet.roundId === activeRoundId) {
            list.push({
              userId: p.userId,
              name: `${p.name} (Вы)`,
              bet: currentBet.bet,
              status: currentBet.status,
              cashoutMult: currentBet.cashoutMult,
              payout: currentBet.payout,
              isMe: true
            });
          } else {
            list.push({
              ...p,
              name: isMe ? `${p.name} (Вы)` : p.name,
              isMe
            });
          }
        }

        playersCountEl.textContent = `${list.length} игр.`;

        if (!list.length) {
          playersListEl.innerHTML = `<div class="empty-box" style="padding:14px;">В этом раунде никто не поставил — раунд идёт без ставок</div>`;
          return;
        }

        playersListEl.innerHTML = list
          .map((p) => {
            let rowCls = p.isMe ? "is-me" : "";
            let rightHtml = `<span class="av-badge-playing">В игре</span>`;

            if (p.status === "won") {
              rowCls += " is-won";
              rightHtml = `<span class="av-badge-won">+${p.payout} ★ · ${Number(p.cashoutMult).toFixed(2)}x</span>`;
            } else if (p.status === "lost") {
              rowCls += " is-lost";
              rightHtml = `<span class="av-badge-lost">0.00x · -${p.bet} ★</span>`;
            }

            const initial = escapeHtml(String(p.name || "И").replace(/^@/, "").charAt(0).toUpperCase());

            return `
              <div class="av-player-row ${rowCls}">
                <div class="av-player-left">
                  <div class="av-avatar">${initial}</div>
                  <div style="min-width:0;">
                    <div class="av-player-name">${escapeHtml(p.name)}</div>
                    <div class="av-player-bet">Ставка: ${p.bet} ★</div>
                  </div>
                </div>
                <div class="av-player-right">${rightHtml}</div>
              </div>
            `;
          })
          .join("");
      }

      /* =========================================================
         4. БЛОКИРОВКА СТАВКИ И МГНОВЕННЫЙ ВЫВОД БЕЗ ЗАДЕРЖЕК
      ========================================================= */
      function setControlsLocked(locked) {
        betInput.disabled = locked;
        targetInput.disabled = locked;
        btnAutoToggle.disabled = locked;
        document.querySelectorAll("[data-av-bet]").forEach((b) => {
          b.disabled = locked;
        });
        document.querySelectorAll("[data-av-mult]").forEach((b) => {
          b.disabled = locked;
        });
      }

      function syncControlsAndButton() {
        const inputBet = Math.max(1, Math.floor(Number(betInput.value || 10)));
        const hasActiveBetInCurrentRound = Boolean(currentBet && currentBet.roundId === activeRoundId);
        const isPlayingNow = hasActiveBetInCurrentRound && currentBet.status === "playing";
        const hasQueuedNext = Boolean(queuedBet);

        const lockInputs = isPlacingBet || hasQueuedNext || (hasActiveBetInCurrentRound && (roundPhase === "waiting" || isPlayingNow));
        setControlsLocked(lockInputs);

        if (isPlacingBet) {
          btnAction.disabled = true;
          btnAction.className = "btn-main";
          btnAction.textContent = "Ожидание раунда";
          return;
        }

        if (roundPhase === "running" && isPlayingNow) {
          const livePayout = Math.max(1, Math.round(currentBet.bet * currentMult));
          btnAction.disabled = cashingOut || currentMult < 0.05;
          btnAction.className = "btn-main cashout-green-btn";
          btnAction.textContent = `Забрать (${livePayout} ★ · ${currentMult.toFixed(2)}x)`;
          return;
        }

        if ((roundPhase === "waiting" && hasActiveBetInCurrentRound) || hasQueuedNext) {
          btnAction.disabled = true;
          btnAction.className = "btn-main";
          btnAction.textContent = "Ожидание раунда";
          return;
        }

        if (roundPhase === "running" || roundPhase === "crashed") {
          btnAction.disabled = false;
          btnAction.className = "btn-main";
          btnAction.textContent = `Поставить (${inputBet} ★)`;
          return;
        }

        btnAction.disabled = false;
        btnAction.className = "btn-main";
        btnAction.textContent = `Поставить ${inputBet} ★`;
      }

      btnAutoToggle.onclick = () => {
        if (btnAutoToggle.disabled) return;
        autoCashEnabled = !autoCashEnabled;
        btnAutoToggle.textContent = autoCashEnabled ? "ВКЛ" : "ВЫКЛ";
        btnAutoToggle.classList.toggle("on", autoCashEnabled);
        autoBox.style.display = autoCashEnabled ? "flex" : "none";
      };

      document.querySelectorAll("[data-av-bet]").forEach((btn) => {
        btn.onclick = () => {
          if (btn.disabled) return;
          betInput.value = btn.getAttribute("data-av-bet");
          syncControlsAndButton();
        };
      });

      document.querySelectorAll("[data-av-mult]").forEach((btn) => {
        btn.onclick = () => {
          if (btn.disabled) return;
          targetInput.value = btn.getAttribute("data-av-mult");
        };
      });

      betInput.oninput = syncControlsAndButton;

      async function placeBetForRound(targetRoundId, betAmount, autoOn, autoMultVal) {
        if (!tg?.initData) {
          toast("Открой игру в Telegram");
          return false;
        }
        const avail = Number(appState?.stars_balance || 0);
        if (avail < betAmount) {
          toast("Недостаточно звёзд на балансе");
          return false;
        }

        isPlacingBet = true;
        syncControlsAndButton();

        try {
          const r = await fetch(apiUrl("/api/avalanche_start"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              bet_stars: betAmount,
              round_id: targetRoundId,
              auto_enabled: autoOn,
              auto_mult: autoMultVal
            })
          });
          const d = await r.json();
          isPlacingBet = false;

          if (!d.ok) {
            toast(d.message || "Не удалось принять ставку");
            syncControlsAndButton();
            return false;
          }

          appState.stars_balance = d.stars_balance;
          appState.wager_left = d.wager_left;
          appState.withdrawable_stars = d.withdrawable_stars;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          currentBet = {
            roundId: targetRoundId,
            serverRoundId: d.round_id || targetRoundId,
            bet: betAmount,
            autoEnabled: autoOn,
            autoMult: autoMultVal,
            status: "playing",
            cashoutMult: 0,
            payout: 0
          };

          renderPlayersList();
          syncControlsAndButton();
          pollRealAvalancheState();
          toast(`Ставка ${betAmount} ★ принята`);
          return true;
        } catch (_) {
          isPlacingBet = false;
          toast("Ошибка сети при ставке");
          syncControlsAndButton();
          return false;
        }
      }

      async function performCashout(multToClaim) {
        if (cashingOut || !currentBet || currentBet.status !== "playing") return;
        if (multToClaim < 0.05) return;

        cashingOut = true;
        const claimMult = Number(multToClaim.toFixed(2));
        const estPayout = Math.max(1, Math.round(currentBet.bet * claimMult));

        // Мгновенная реакция UI без задержки «Забираем...»
        currentBet.status = "won";
        currentBet.cashoutMult = claimMult;
        currentBet.payout = estPayout;
        arena.classList.add("won");
        statusEl.textContent = `Вы забрали +${estPayout} ★ на ${claimMult.toFixed(2)}x!`;
        playWin();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        renderPlayersList();
        syncControlsAndButton();

        try {
          const r = await fetch(apiUrl("/api/avalanche_cashout"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              round_id: currentBet.serverRoundId || activeRoundId,
              mult: claimMult
            })
          });
          const d = await r.json();
          cashingOut = false;

          if (!d.ok) {
            currentBet.status = "lost";
            currentBet.cashoutMult = 0;
            currentBet.payout = 0;
            arena.classList.remove("won");
            toast(d.message || "Не успел забрать до схода");
            renderPlayersList();
            syncControlsAndButton();
            return;
          }

          appState.stars_balance = d.stars_balance;
          appState.wager_left = d.wager_left;
          appState.withdrawable_stars = d.withdrawable_stars;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          currentBet.cashoutMult = Number(d.mult || claimMult);
          currentBet.payout = Number(d.payout || estPayout);
          statusEl.textContent = `Вы забрали +${currentBet.payout} ★ на ${currentBet.cashoutMult.toFixed(2)}x!`;
          toast(`Забрано ${currentBet.cashoutMult.toFixed(2)}x (+${currentBet.payout} ★)!`);
          renderPlayersList();
          pollRealAvalancheState();
        } catch (_) {
          cashingOut = false;
          toast("Ошибка сети при выводе");
          syncControlsAndButton();
        }
      }

      btnAction.onclick = async () => {
        if (btnAction.disabled) return;

        const betVal = Math.max(1, Math.floor(Number(betInput.value || 10)));
        const autoVal = autoCashEnabled ? Math.max(1.05, Number(targetInput.value || 1.5)) : 0;

        if (roundPhase === "running" && currentBet && currentBet.roundId === activeRoundId && currentBet.status === "playing") {
          await performCashout(currentMult);
          return;
        }

        if (roundPhase === "running" || roundPhase === "crashed") {
          if (queuedBet) return;
          const avail = Number(appState?.stars_balance || 0);
          if (avail < betVal) {
            toast("Недостаточно звёзд на балансе");
            return;
          }
          queuedBet = { bet: betVal, autoEnabled: autoCashEnabled, autoMult: autoVal };
          syncControlsAndButton();
          toast(`Ставка ${betVal} ★ в очереди на следующий раунд`);
          return;
        }

        if (roundPhase === "waiting") {
          if (currentBet && currentBet.roundId === activeRoundId) return;
          await placeBetForRound(activeRoundId, betVal, autoCashEnabled, autoVal);
        }
      };

      /* =========================================================
         5. ГЛАВНЫЙ ЦИКЛ ОБЩЕГО РАУНДА (КОРОТКИЙ ПЕРЕРЫВ МЕЖДУ РАУНДАМИ)
      ========================================================= */
      const WAIT_SEC = 5.0;
      const CRASH_PAUSE_SEC = 1.6;
      const SLOT_LEN = 21.0;
      let prevEpochIdx = -1;

      function tickSharedRound() {
        const nowSec = Date.now() / 1000;
        const epochIdx = Math.floor(nowSec / SLOT_LEN);
        const slotOffset = nowSec - epochIdx * SLOT_LEN;

        const rId = `round_${epochIdx}`;
        const rawCrash = (serverAvalancheData?.round_id === rId && typeof serverAvalancheData?.crash_mult === "number")
          ? Number(serverAvalancheData.crash_mult)
          : computeFallbackCrash(epochIdx);

        const flightDuration = computeDurationForCrash(rawCrash);
        const maxFlight = SLOT_LEN - WAIT_SEC - CRASH_PAUSE_SEC;
        const activeFlightLen = Math.min(maxFlight, flightDuration);
        const effectiveCrash = rawCrash <= 0
          ? 0.0
          : computeMultiplierAtElapsed(activeFlightLen);

        if (epochIdx !== prevEpochIdx) {
          prevEpochIdx = epochIdx;
          activeRoundId = rId;
          crashMult = effectiveCrash;
          lastCountdownNum = null;
          lastTickBucket = -1;
          realRoundPlayers = [];
          graphPoints = [];

          if (currentBet && currentBet.roundId !== rId) {
            currentBet = null;
          }

          if (queuedBet) {
            const q = queuedBet;
            queuedBet = null;
            placeBetForRound(rId, q.bet, q.autoEnabled, q.autoMult);
          }

          renderPlayersList();
          pollRealAvalancheState();
        }

        // ФАЗА 1: ОБРАТНЫЙ ОТСЧЁТ 5.. 4.. 3.. 2.. 1..
        if (slotOffset < WAIT_SEC) {
          roundPhase = "waiting";
          currentMult = 0.0;
          currentFlightElapsed = 0.0;
          graphPoints = [];
          const left = Math.max(0.01, WAIT_SEC - slotOffset);
          const countNum = Math.ceil(left);

          arena.className = "avalanche-arena waiting";
          stageLabelEl.textContent = "СТАРТ ЧЕРЕЗ";
          multEl.textContent = `${countNum}`;
          statusEl.textContent = currentBet && currentBet.roundId === rId
            ? `Ваша ставка ${currentBet.bet} ★ принята · старт через ${countNum} сек.`
            : `Приём ставок · старт через ${countNum} сек.`;
          waveEl.style.transform = "translateY(100%)";

          countdownTrack.style.display = "block";
          countdownFill.style.width = `${Math.min(100, (slotOffset / WAIT_SEC) * 100)}%`;

          if (countNum !== lastCountdownNum) {
            lastCountdownNum = countNum;
            playTick();
          }

          syncControlsAndButton();
          requestAnimationFrame(tickSharedRound);
          return;
        }

        countdownTrack.style.display = "none";

        // ФАЗА 2: АКТИВНЫЙ РАУНД (ГРАФИК ПОДЪЁМА + УСКОРЕНИЕ)
        const flightElapsed = slotOffset - WAIT_SEC;
        if (flightElapsed < activeFlightLen && effectiveCrash > 0) {
          roundPhase = "running";
          currentFlightElapsed = flightElapsed;
          currentMult = computeMultiplierAtElapsed(flightElapsed);

          if (graphPoints.length === 0) {
            graphPoints.push({ t: 0, m: 0 });
          }
          const lastPt = graphPoints[graphPoints.length - 1];
          if (flightElapsed - lastPt.t >= 0.05) {
            graphPoints.push({ t: flightElapsed, m: currentMult });
          }

          const hasWon = currentBet && currentBet.roundId === rId && currentBet.status === "won";
          arena.className = `avalanche-arena running${hasWon ? " won" : ""}${currentMult >= 2.2 ? " danger" : ""}`;
          stageLabelEl.textContent = "ПОДЪЁМ ЛАВИНЫ";
          multEl.textContent = `${currentMult.toFixed(2)}x`;

          if (hasWon) {
            statusEl.textContent = `Вы забрали +${currentBet.payout} ★ (${currentBet.cashoutMult.toFixed(2)}x) · раунд продолжается`;
          } else if (currentBet && currentBet.roundId === rId && currentBet.status === "playing") {
            statusEl.textContent = "Жми «Забрать», пока лавина не накрыла!";
          } else if (queuedBet) {
            statusEl.textContent = `Ваша ставка ${queuedBet.bet} ★ ждёт следующий раунд`;
          } else {
            statusEl.textContent = "Раунд идёт · ставка сейчас пойдёт на следующий раунд";
          }

          const waveRise = Math.max(12, 96 - currentMult * 11);
          waveEl.style.transform = `translateY(${waveRise}%)`;

          // Мгновенный авто-выход
          if (
            currentBet &&
            currentBet.roundId === rId &&
            currentBet.status === "playing" &&
            currentBet.autoEnabled &&
            currentBet.autoMult > 0 &&
            currentMult >= currentBet.autoMult
          ) {
            performCashout(currentBet.autoMult);
          }

          const bucket = Math.floor(currentMult * 6);
          if (bucket !== lastTickBucket) {
            lastTickBucket = bucket;
            playTick();
          }

          syncControlsAndButton();
          requestAnimationFrame(tickSharedRound);
          return;
        }

        // ФАЗА 3: КОНЕЦ РАУНДА / ОБВАЛ ЛАВИНЫ В СУГРОБЫ
        if (roundPhase !== "crashed") {
          roundPhase = "crashed";
          currentMult = effectiveCrash;
          waveEl.style.transform = "translateY(100%)";
          spawnSnowCollapseClumps();

          if (!serverAvalancheData?.history) {
            if (historyMults[0] !== effectiveCrash || historyMults.length === 0) {
              historyMults.unshift(effectiveCrash);
              if (historyMults.length > 14) historyMults.pop();
              renderHistoryBar();
            }
          }

          if (currentBet && currentBet.roundId === rId && currentBet.status === "playing") {
            currentBet.status = "lost";
            currentBet.cashoutMult = 0;
            currentBet.payout = 0;
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
          }

          for (const p of realRoundPlayers) {
            if (p.status === "playing") {
              p.status = "lost";
              p.cashoutMult = 0;
              p.payout = 0;
            }
          }
          renderPlayersList();
          pollRealAvalancheState();
        }

        arena.className = "avalanche-arena crashed";
        stageLabelEl.textContent = effectiveCrash <= 0 ? "МГНОВЕННЫЙ СХОД" : "ЛАВИНА СОШЛА";
        multEl.textContent = `${effectiveCrash.toFixed(2)}x`;
        statusEl.textContent = effectiveCrash <= 0
          ? "Лавина обрушилась на 0.00x! Новый раунд через секунду..."
          : `Снег накрыл арену на ${effectiveCrash.toFixed(2)}x · можно ставить`;

        syncControlsAndButton();
        requestAnimationFrame(tickSharedRound);
      }

      renderHistoryBar();
      renderPlayersList();
      requestAnimationFrame(tickSharedRound);
    })();
  </script>
</body>
</html>
