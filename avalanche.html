<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Лавина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .avalanche-arena {
      position: relative;
      height: 210px;
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 25%, rgba(56, 189, 248, 0.22) 0%, transparent 65%),
        linear-gradient(180deg, #0e1a33 0%, #090e1c 100%);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
    }
    .avalanche-mult {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.05;
    }
    .avalanche-arena.crashed .avalanche-mult {
      background: linear-gradient(180deg, #fda4af 0%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .avalanche-arena.won .avalanche-mult {
      background: linear-gradient(180deg, #fef08a 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .avalanche-status {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="sec-row fade-in">
      <a class="btn-mini-refresh" href="index.html">&lt; Назад</a>
      <span class="pill-ice">ИГРА «ЛАВИНА»</span>
    </div>

    <div class="section-card fade-in">
      <div class="avalanche-arena" id="avalancheArena">
        <div class="avalanche-mult" id="avMultText">1.00x</div>
        <div class="avalanche-status" id="avStatusText">Выбери ставку и цель выхода до схода лавины</div>
      </div>

      <div class="grid-2">
        <div>
          <div class="row-sub" style="margin-bottom:4px;">Ставка (★)</div>
          <input type="number" class="field-input" id="avBetInput" min="1" max="2000" value="10" />
        </div>
        <div>
          <div class="row-sub" style="margin-bottom:4px;">Авто-выход (x)</div>
          <input type="number" class="field-input" id="avTargetInput" min="1.1" max="25" step="0.1" value="1.5" />
        </div>
      </div>

      <div class="chips-row-3">
        <button type="button" class="btn-soft" data-av-mult="1.3">1.30x</button>
        <button type="button" class="btn-soft" data-av-mult="2.0">2.00x</button>
        <button type="button" class="btn-soft" data-av-mult="3.5">3.50x</button>
      </div>

      <button type="button" class="btn-main" id="btnStartAvalanche">Запустить раунд</button>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;
      let running = false;

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
        }
      });
      if (!session) return;
      appState = session.state;

      document.querySelectorAll("[data-av-mult]").forEach((btn) => {
        btn.onclick = () => {
          if (running) return;
          document.getElementById("avTargetInput").value = btn.getAttribute("data-av-mult");
        };
      });

      document.getElementById("btnStartAvalanche").onclick = async () => {
        if (running) return;
        const bet = Math.max(1, Math.floor(Number(document.getElementById("avBetInput").value || 0)));
        const target = Math.max(1.1, Number(document.getElementById("avTargetInput").value || 1.5));
        if (!tg?.initData) {
          toast("Открой в Telegram");
          return;
        }

        running = true;
        const btn = document.getElementById("btnStartAvalanche");
        const arena = document.getElementById("avalancheArena");
        const multEl = document.getElementById("avMultText");
        const statusEl = document.getElementById("avStatusText");

        btn.disabled = true;
        arena.className = "avalanche-arena";
        statusEl.textContent = "Лавина набирает скорость...";

        try {
          const r = await fetch(apiUrl("/api/avalanche_play"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              bet_stars: bet,
              target_mult: target
            })
          });
          const d = await r.json();
          if (!d.ok) {
            running = false;
            btn.disabled = false;
            toast(d.message || "Ошибка запуска");
            return;
          }

          const stopAt = d.won ? target : Number(d.crash_mult || 1.0);
          let cur = 1.0;
          const timer = setInterval(() => {
            cur = Number((cur + 0.04 + cur * 0.025).toFixed(2));
            if (cur >= stopAt) {
              cur = stopAt;
              clearInterval(timer);
              multEl.textContent = `${cur.toFixed(2)}x`;

              appState.stars_balance = d.stars_balance;
              appState.wager_left = d.wager_left;
              appState.withdrawable_stars = d.withdrawable_stars;
              updateStarsDisplay(appState.stars_balance);
              saveCache(appState);

              running = false;
              btn.disabled = false;

              if (d.won) {
                arena.classList.add("won");
                statusEl.textContent = `Успел забрать! Выигрыш: +${d.payout} ★`;
                playWin();
                toast(`Забрано ${cur.toFixed(2)}x (+${d.payout} ★)!`);
              } else {
                arena.classList.add("crashed");
                statusEl.textContent = `Накрыло лавиной на ${cur.toFixed(2)}x`;
                toast("Лавина сошла раньше цели");
              }
            } else {
              multEl.textContent = `${cur.toFixed(2)}x`;
              playTick();
            }
          }, 55);
        } catch (_) {
          running = false;
          btn.disabled = false;
          toast("Ошибка сети");
        }
      };
    })();
  </script>
</body>
</html>
