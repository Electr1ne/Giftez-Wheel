<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Кейсы и апгрейды</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <!-- Статус подписки на канал -->
    <div class="channel-row fade-in" id="channelRow">
      <div class="channel-info">
        <h3>Канал @gift_e_z</h3>
        <p>Подписка для ежедневного кейса</p>
      </div>
      <div class="status-pill no" id="subStatusPill">Проверка...</div>
    </div>

    <!-- Ежедневный кейс (всегда сверху над карточками игр) -->
    <a class="winter-hero fade-in" href="case.html?id=daily">
      <div class="hero-left">
        <div class="hero-chip" id="dailyChipText">БЕСПЛАТНО РАЗ В 24Ч</div>
        <h2>Ежедневный кейс</h2>
        <p>Внутри: до 5 ★ на баланс, Мишка (15 ★) и Роза (25 ★)</p>
        <span class="hero-open-btn" id="dailyHeroBtn">Открыть кейс &gt;</span>
      </div>
      <div class="hero-right">
        <img src="./daily.png" onerror="this.src=getFallbackSrc('gift')" alt="Ежедневный кейс" />
      </div>
    </a>

    <!-- Блок отсчёта до зимнего ивента (1 декабря 00:00 МСК) + Ледяная шкала (в v2) -->
    <div id="eventBlockMount"></div>

    <!-- Раздел Игры (v2: карточки Кейсы + Апгрейдер + Лавина) -->
    <div id="gamesHubMount"></div>

    <!-- Витрина кейсов по категориям -->
    <div id="casesShowcaseMount"></div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;
      let activeCategory = "all";

      function formatCountdown(sec) {
        const total = Math.max(0, Math.floor(sec));
        const d = Math.floor(total / 86400);
        const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
        const s = String(total % 60).padStart(2, "0");
        return d > 0 ? `${d}д ${h}:${m}:${s}` : `${h}:${m}:${s}`;
      }

      function renderSubRow() {
        if (!appState) return;
        const pill = document.getElementById("subStatusPill");
        if (appState.is_subscribed) {
          pill.textContent = "Подписан";
          pill.className = "status-pill ok";
        } else {
          pill.textContent = "Подписаться";
          pill.className = "status-pill no";
        }
      }

      function renderDailyTimer() {
        if (!appState) return;
        const chip = document.getElementById("dailyChipText");
        const btn = document.getElementById("dailyHeroBtn");
        const now = Math.floor(Date.now() / 1000);
        const nextAt = Number(appState.next_spin_at || 0);

        if (!nextAt || nextAt <= now) {
          chip.textContent = "ДОСТУПЕН СЕЙЧАС";
          btn.textContent = "Открыть кейс >";
          return;
        }

        chip.textContent = `ЧЕРЕЗ ${formatCountdown(nextAt - now)}`;
        btn.textContent = "Перейти к кейсу >";
      }

      function renderEventSection() {
        const host = document.getElementById("eventBlockMount");
        if (!host || !appState) return;

        const isV2 = (appState.ui_version || "v1") === "v2";
        if (!isV2) {
          host.innerHTML = "";
          return;
        }

        const now = Math.floor(Date.now() / 1000);
        const startTs = Number(appState.event_start_ts || 1796072400);
        const isBeforeOfficialStart = now < startTs;
        const isUnlocked = Boolean(appState.event_unlocked);
        const pts = Number(appState.event_points || 0);
        const claimed = Number(appState.event_claimed_stage || 0);
        const stages = Array.isArray(appState.event_stages) ? appState.event_stages : [];
        const nextStage = stages.find((s) => s.stage === claimed + 1);
        const maxPts = stages.length ? stages[stages.length - 1].points : 650;
        const pct = Math.min(100, Math.round((pts / Math.max(1, maxPts)) * 100));
        const canClaim = Boolean(nextStage && pts >= nextStage.points && isUnlocked);

        host.innerHTML = `
          <div class="event-banner-card fade-in">
            <div class="event-top-row">
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="pill-ice">❄️ ИВЕНТ «СНЕГОПАД»</span>
                ${isBeforeOfficialStart && isUnlocked ? `<span class="pill-gold-sm">ПРЕВЬЮ</span>` : ""}
              </div>
              <span class="event-timer-chip" id="eventCountdownChip">
                ${isBeforeOfficialStart ? `Старт: ${formatCountdown(startTs - now)}` : "АКТИВЕН"}
              </span>
            </div>

            <div class="event-desc">
              ${isBeforeOfficialStart
                ? "1 декабря в 00:00 МСК откроются ледяная шкала наград, игра «Лавина» и лимитные кейсы."
                : "Крути кейсы, делай апгрейды и лови иксы в «Лавине» — собирай снежинки и забирай награды!"}
            </div>

            <div class="ice-progress-wrap">
              <div class="ice-progress-bar">
                <div class="ice-progress-fill" style="width:${pct}%;"></div>
              </div>
              <div class="ice-progress-meta">
                <span>Снежинки: <b>${pts}</b> / ${nextStage ? nextStage.points : maxPts}</span>
                <span>${nextStage ? `Этап ${nextStage.stage}: +${nextStage.reward_stars} ★` : "Все этапы пройдены"}</span>
              </div>
            </div>

            ${canClaim ? `<button type="button" class="btn-main" id="btnClaimEventStage" style="height:40px;min-height:40px;">Забрать награду этапа (+${nextStage.reward_stars} ★)</button>` : ""}
          </div>
        `;

        const claimBtn = document.getElementById("btnClaimEventStage");
        if (claimBtn) {
          claimBtn.onclick = async () => {
            claimBtn.disabled = true;
            try {
              const r = await fetch(apiUrl("/api/event_claim_stage"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData })
              });
              const d = await r.json();
              if (d.ok) {
                playWin();
                appState.event_claimed_stage = d.claimed_stage;
                appState.stars_balance = d.stars_balance;
                appState.wager_left = d.wager_left;
                appState.withdrawable_stars = d.withdrawable_stars;
                saveCache(appState);
                updateStarsDisplay(appState.stars_balance);
                renderEventSection();
                toast(`Получено +${d.reward_stars} ★ за этап снегопада!`);
              } else {
                claimBtn.disabled = false;
                toast(d.message || "Не удалось забрать награду");
              }
            } catch (_) {
              claimBtn.disabled = false;
              toast("Ошибка сети");
            }
          };
        }
      }

      function renderGamesHub() {
        const host = document.getElementById("gamesHubMount");
        if (!host || !appState) return;
        const isV2 = (appState.ui_version || "v1") === "v2";

        if (!isV2) {
          host.innerHTML = `
            <div class="sec-row fade-in">
              <div class="sec-title">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <span>Игры</span>
              </div>
              <span class="sec-sub">Шанс до 75%</span>
            </div>
            <a class="upgrade-card-banner fade-in" href="upgrader.html">
              <div>
                <h3>Апгрейдер</h3>
                <p>Прокачай ставку в звёзды с выбором множителя</p>
              </div>
              <div class="upgrade-badge-box">
                <span>★</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2.4">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                  <polyline points="12 5 19 12 12 19"/>
                </svg>
                <img src="./ring.png" onerror="this.src=getFallbackSrc('ring')" style="width:20px;height:20px;object-fit:contain;" alt="" />
              </div>
            </a>
          `;
          return;
        }

        const now = Math.floor(Date.now() / 1000);
        const startTs = Number(appState.event_start_ts || 1796072400);
        const avalancheUnlocked = Boolean(appState.event_unlocked);

        host.innerHTML = `
          <div class="sec-row fade-in">
            <div class="sec-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              <span>Игры</span>
            </div>
            <span class="sec-sub">Выбери режим</span>
          </div>

          <div class="games-tiles-grid fade-in">
            <a class="game-tile-card tile-cases" href="#casesShowcaseAnchor" id="scrollToCasesTile">
              <div class="game-tile-art">
                <img src="./newyear.png" onerror="this.src=getFallbackSrc('gift')" alt="Кейсы" />
              </div>
              <div class="game-tile-pill">До 150 ★</div>
              <div class="game-tile-title">Кейсы</div>
            </a>

            <a class="game-tile-card tile-upgrader" href="upgrader.html">
              <div class="game-tile-art">
                <img src="./ring.png" onerror="this.src=getFallbackSrc('ring')" alt="Апгрейдер" />
              </div>
              <div class="game-tile-pill">До 75%</div>
              <div class="game-tile-title">Апгрейдер</div>
            </a>

            <a class="game-tile-card tile-avalanche ${avalancheUnlocked ? "" : "is-locked"}" href="${avalancheUnlocked ? "avalanche.html" : "#"}">
              <div class="game-tile-art">
                <img src="./rocket.png" onerror="this.src=getFallbackSrc('rocket')" alt="Лавина" />
              </div>
              <div class="game-tile-pill" id="avalancheTileBadge">
                ${avalancheUnlocked ? "NEW · x25" : `1 дек · ${formatCountdown(startTs - now)}`}
              </div>
              <div class="game-tile-title">Лавина</div>
            </a>
          </div>
        `;

        const casesTile = document.getElementById("scrollToCasesTile");
        if (casesTile) {
          casesTile.onclick = (e) => {
            e.preventDefault();
            document.getElementById("casesShowcaseMount")?.scrollIntoView({ behavior: "smooth" });
          };
        }
      }

      function renderCases() {
        const host = document.getElementById("casesShowcaseMount");
        if (!host) return;

        const isV2 = (appState && (appState.ui_version || "v1") === "v2");
        const sourceList = (appState && Array.isArray(appState.cases) && appState.cases.length)
          ? appState.cases
          : DEFAULT_CASES_LIST;

        const paidCases = sourceList.filter((c) => !c.is_daily && c.id !== "daily");

        const categories = [
          { id: "all", label: "Все" },
          { id: "snowflakes", label: "Снежинки (до 10 ★)" },
          { id: "drifts", label: "Сугробы (15–50 ★)" },
          { id: "aurora", label: "Северное сияние (60–150 ★)" },
          { id: "thin_ice", label: "Тонкий лёд" },
          { id: "limited", label: "Лимитки и Ивент" }
        ];

        const filtered = !isV2
          ? paidCases
          : paidCases.filter((c) => {
              if (activeCategory === "all") return true;
              if (activeCategory === "limited") {
                return c.availability === "limited" || c.availability === "timed";
              }
              return c.category === activeCategory;
            });

        const tabsHtml = isV2
          ? `<div class="cat-tabs-scroll fade-in">
              ${categories
                .map(
                  (cat) => `
                    <button type="button" class="cat-tab-btn ${activeCategory === cat.id ? "active" : ""}" data-cat="${cat.id}">
                      ${escapeHtml(cat.label)}
                    </button>
                  `
                )
                .join("")}
            </div>`
          : "";

        const cardsHtml = filtered
          .map((c) => {
            const href = `case.html?id=${encodeURIComponent(c.id)}`;
            const isSoldOut = Boolean(c.is_sold_out);
            const isLocked = Boolean(c.is_locked);
            const hasLimit = c.availability === "limited" && typeof c.max_opens === "number";
            const rem = typeof c.remaining === "number" ? c.remaining : c.max_opens;

            let tierCls = "";
            if (c.special_mode === "thin_ice") tierCls = "tier-thin-ice";
            else if (Number(c.price) >= 75 || c.id === "newyear") tierCls = "tier-gold";
            else if (Number(c.price) >= 20 || c.id === "morozniy") tierCls = "tier-indigo";

            const limitLine = hasLimit
              ? `<div class="case-limit-line">Осталось: <b>${rem}</b> из ${c.max_opens}</div>`
              : (c.availability === "timed"
                  ? `<div class="case-limit-line">Сезонный кейс</div>`
                  : `<div class="case-limit-line">${c.reroll_allowed === false ? "Без перекрута" : `Перекрут ${Number(c.reroll_price || 0)} ★`}</div>`);

            let btnText = `${Number(c.price)} ★`;
            if (isSoldOut) btnText = "РАСКУПЛЕН";
            else if (isLocked) btnText = "1 ДЕК 00:00";

            return `
              <a class="case-card-link ${tierCls} ${isSoldOut || isLocked ? "is-disabled-card" : ""}" href="${href}">
                <span class="case-tag">${escapeHtml(c.badge || "ЗИМА")}</span>
                <div class="case-art">
                  <img src="./${escapeHtml(c.icon || "starter.png")}" onerror="this.src=getFallbackSrc('${escapeHtml(c.id)}')" alt="${escapeHtml(c.name)}" />
                </div>
                <div class="case-name">${escapeHtml(c.name)}</div>
                ${isV2 ? limitLine : ""}
                <div class="case-btn-pill">${btnText}</div>
              </a>
            `;
          })
          .join("");

        host.innerHTML = `
          <div class="sec-row fade-in" id="casesShowcaseAnchor">
            <div class="sec-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2.2">
                <rect x="3" y="8" width="18" height="13" rx="2"/>
                <path d="M12 8v13"/>
                <path d="M3 12h18"/>
              </svg>
              <span>Зимние кейсы</span>
            </div>
            <span class="sec-sub">${isV2 ? "До 150 ★ и лимитки" : "С перекрутом дропа"}</span>
          </div>
          ${tabsHtml}
          <div class="cases-grid-2 fade-in">${cardsHtml || `<div class="empty-box" style="grid-column:1/-1;">В этой категории пока нет кейсов</div>`}</div>
        `;

        host.querySelectorAll("[data-cat]").forEach((btn) => {
          btn.onclick = () => {
            activeCategory = btn.getAttribute("data-cat") || "all";
            renderCases();
          };
        });
      }

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
          renderSubRow();
          renderDailyTimer();
          renderEventSection();
          renderGamesHub();
          renderCases();
        }
      });

      if (!session) return;
      appState = session.state;

      renderSubRow();
      renderDailyTimer();
      renderEventSection();
      renderGamesHub();
      renderCases();

      setInterval(() => {
        renderDailyTimer();
        if (appState && (appState.ui_version || "v1") === "v2") {
          const now = Math.floor(Date.now() / 1000);
          const startTs = Number(appState.event_start_ts || 1796072400);
          const chip = document.getElementById("eventCountdownChip");
          if (chip && now < startTs) {
            chip.textContent = `Старт: ${formatCountdown(startTs - now)}`;
          }
          const avBadge = document.getElementById("avalancheTileBadge");
          if (avBadge && !appState.event_unlocked && now < startTs) {
            avBadge.textContent = `1 дек · ${formatCountdown(startTs - now)}`;
          }
        }
      }, 1000);

      document.getElementById("subStatusPill").onclick = async () => {
        if (appState.is_subscribed) return;
        const url = `https://t.me/${GIFTEZ_CONFIG.CHANNEL_USERNAME}`;
        if (tg?.openTelegramLink) tg.openTelegramLink(url);
        else window.open(url, "_blank");

        if (tg?.initData) {
          setTimeout(async () => {
            const r = await fetch(apiUrl("/api/check_sub"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: tg.initData })
            });
            const d = await r.json();
            if (d.ok) {
              appState.is_subscribed = Boolean(d.is_subscribed);
              saveCache(appState);
              renderSubRow();
            }
          }, 2500);
        }
      };
    })();
  </script>
</body>
</html>
