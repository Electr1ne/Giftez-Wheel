<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Кейсы и апгрейды</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <!-- Статус подписки на канал -->
    <div class="channel-row fade-in" id="channelRow">
      <div class="channel-info">
        <h3>Канал @gift_e_z</h3>
        <p>Подписка для ежедневного кейса</p>
      </div>
      <div class="status-pill no" id="subStatusPill">Проверка...</div>
    </div>

    <!-- Промо-баннер ежедневного кейса (отдельная страница case-daily.html) -->
    <a class="winter-hero fade-in" href="case-daily.html">
      <div class="hero-left">
        <div class="hero-chip" id="dailyChipText">БЕСПЛАТНО РАЗ В 24Ч</div>
        <h2>Ежедневный кейс</h2>
        <p>Внутри: Мишка, Роза и от 1 до 20 ★ на баланс</p>
        <span class="hero-open-btn" id="dailyHeroBtn">Открыть кейс &gt;</span>
      </div>
      <div class="hero-right">
        <img src="./bear.png" onerror="this.src=getFallbackSrc('bear')" alt="Ежедневный кейс" />
      </div>
    </a>

    <!-- Раздел Игры (только Апгрейдер) -->
    <div class="sec-row fade-in">
      <div class="sec-title">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Игры</span>
      </div>
      <span class="sec-sub">Шанс до 80%</span>
    </div>

    <a class="upgrade-card-banner fade-in" href="upgrader.html">
      <div>
        <h3>Апгрейдер</h3>
        <p>Прокачай звёзды в подарок с выбором шанса</p>
      </div>
      <div class="upgrade-badge-box">
        <span>★</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2.4">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
        <span>🎁</span>
      </div>
    </a>

    <!-- Раздел Кейсы (сетка 2 в ряд, каждый кейс открывает свою страницу) -->
    <div class="sec-row fade-in">
      <div class="sec-title">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2">
          <rect x="3" y="8" width="18" height="13" rx="2"/>
          <path d="M12 8v13"/>
          <path d="M3 12h18"/>
        </svg>
        <span>Зимние кейсы</span>
      </div>
      <span class="sec-sub">Перекрут за 3 ★</span>
    </div>

    <div class="cases-grid-2 fade-in" id="casesGrid2"></div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      const PAGE_MAP = {
        daily: "case-daily.html",
        starter: "case-starter.html",
        romance: "case-romance.html",
        cosmos: "case-cosmos.html",
        luxury: "case-luxury.html"
      };

      let appState = null;

      function renderSubRow() {
        if (!appState) return;
        const pill = document.getElementById("subStatusPill");
        if (appState.is_subscribed) {
          pill.textContent = "Подписан";
          pill.className = "status-pill ok";
        } else {
          pill.textContent = "Подписаться";
          pill.className = "status-pill no";
        }
      }

      function renderDailyTimer() {
        if (!appState) return;
        const chip = document.getElementById("dailyChipText");
        const btn = document.getElementById("dailyHeroBtn");
        const now = Math.floor(Date.now() / 1000);
        const nextAt = Number(appState.next_spin_at || 0);

        if (!nextAt || nextAt <= now) {
          chip.textContent = "ДОСТУПЕН СЕЙЧАС";
          btn.textContent = "Открыть кейс >";
          return;
        }

        const left = nextAt - now;
        const h = String(Math.floor(left / 3600)).padStart(2, "0");
        const m = String(Math.floor((left % 3600) / 60)).padStart(2, "0");
        const s = String(left % 60).padStart(2, "0");
        chip.textContent = `ЧЕРЕЗ ${h}:${m}:${s}`;
        btn.textContent = "Перейти к кейсу >";
      }

      function renderCases() {
        const grid = document.getElementById("casesGrid2");
        const sourceList = (appState && Array.isArray(appState.cases) && appState.cases.length)
          ? appState.cases
          : DEFAULT_CASES_LIST;

        const paidCases = sourceList.filter((c) => !c.is_daily && c.id !== "daily");

        grid.innerHTML = paidCases
          .map((c) => {
            const href = PAGE_MAP[c.id] || `case.html?id=${encodeURIComponent(c.id)}`;
            const fbKey = c.id === "romance" ? "rose" : (c.id === "cosmos" ? "rocket" : (c.id === "luxury" ? "ring" : "bear"));
            const tierCls = c.id === "luxury" ? "tier-gold" : (c.id === "romance" ? "tier-pine" : "");
            return `
              <a class="case-card-link ${tierCls}" href="${href}">
                <span class="case-tag">${escapeHtml(c.badge || "ЗИМА")}</span>
                <div class="case-art">
                  <img src="./${escapeHtml(c.icon || "bear.png")}" onerror="this.src=getFallbackSrc('${fbKey}')" alt="${escapeHtml(c.name)}" />
                </div>
                <div class="case-name">${escapeHtml(c.name)}</div>
                <div class="case-btn-pill">${Number(c.price)} ★</div>
              </a>
            `;
          })
          .join("");
      }

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
          renderSubRow();
          renderDailyTimer();
          renderCases();
        }
      });

      if (!session) return;
      appState = session.state;

      renderSubRow();
      renderDailyTimer();
      renderCases();
      setInterval(renderDailyTimer, 1000);

      document.getElementById("subStatusPill").onclick = async () => {
        if (appState.is_subscribed) return;
        const url = `https://t.me/${GIFTEZ_CONFIG.CHANNEL_USERNAME}`;
        if (tg?.openTelegramLink) tg.openTelegramLink(url);
        else window.open(url, "_blank");

        if (tg?.initData) {
          setTimeout(async () => {
            const r = await fetch(apiUrl("/api/check_sub"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: tg.initData })
            });
            const d = await r.json();
            if (d.ok) {
              appState.is_subscribed = Boolean(d.is_subscribed);
              saveCache(appState);
              renderSubRow();
            }
          }, 2500);
        }
      };
    })();
  </script>
</body>
</html>
