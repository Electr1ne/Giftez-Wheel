<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Кейсы и игры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <!-- Статус подписки на канал -->
    <div class="channel-row fade-in" id="channelRow">
      <div class="channel-info">
        <h3>Канал @gift_e_z</h3>
        <p>Подписка для ежедневного кейса</p>
      </div>
      <div class="status-pill no" id="subStatusPill">Проверка...</div>
    </div>

    <!-- Ежедневный кейс (над карточками игр) -->
    <a class="winter-hero fade-in" href="case.html?id=daily">
      <div class="hero-left">
        <div class="hero-chip" id="dailyChipText">БЕСПЛАТНО РАЗ В 24Ч</div>
        <h2>Ежедневный кейс</h2>
        <p>Внутри: до 3 ★ на баланс, Мишка (15 ★) и Роза (25 ★)</p>
        <span class="hero-open-btn" id="dailyHeroBtn">Открыть кейс &gt;</span>
      </div>
      <div class="hero-right">
        <img src="./daily.png" onerror="this.src=getFallbackSrc('gift')" alt="Ежедневный кейс" />
      </div>
    </a>

    <!-- Отсчёт до зимнего ивента (1 декабря 00:00 МСК) и Ледяная шкала -->
    <div id="eventBlockMount"></div>

    <!-- Раздел Игры (без списка кейсов на главной) -->
    <div id="gamesHubMount"></div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;

      function formatCountdown(sec) {
        const total = Math.max(0, Math.floor(sec));
        const d = Math.floor(total / 86400);
        const h = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
        const s = String(total % 60).padStart(2, "0");
        return d > 0 ? `${d}д ${h}:${m}:${s}` : `${h}:${m}:${s}`;
      }

      function renderSubRow() {
        if (!appState) return;
        const pill = document.getElementById("subStatusPill");
        if (appState.is_subscribed) {
          pill.textContent = "Подписан";
          pill.className = "status-pill ok";
        } else {
          pill.textContent = "Подписаться";
          pill.className = "status-pill no";
        }
      }

      function renderDailyTimer() {
        if (!appState) return;
        const chip = document.getElementById("dailyChipText");
        const btn = document.getElementById("dailyHeroBtn");
        const now = Math.floor(Date.now() / 1000);
        const nextAt = Number(appState.next_spin_at || 0);

        if (!nextAt || nextAt <= now) {
          chip.textContent = "ДОСТУПЕН СЕЙЧАС";
          btn.textContent = "Открыть кейс >";
          return;
        }

        chip.textContent = `ЧЕРЕЗ ${formatCountdown(nextAt - now)}`;
        btn.textContent = "Перейти к кейсу >";
      }

      function renderEventSection() {
        const host = document.getElementById("eventBlockMount");
        if (!host || !appState) return;

        const isV2 = (appState.ui_version || "v1") === "v2";
        const now = Math.floor(Date.now() / 1000);
        const startTs = Number(appState.event_start_ts || 1796072400);
        const isBeforeOfficialStart = now < startTs;
        const isUnlocked = Boolean(appState.event_unlocked);

        if (!isV2 && !isUnlocked) {
          host.innerHTML = "";
          return;
        }

        const pts = Number(appState.event_points || 0);
        const claimed = Number(appState.event_claimed_stage || 0);
        const stages = Array.isArray(appState.event_stages) ? appState.event_stages : [];
        const nextStage = stages.find((s) => s.stage === claimed + 1);
        const maxPts = stages.length ? stages[stages.length - 1].points : 1600;
        const pct = Math.min(100, Math.round((pts / Math.max(1, maxPts)) * 100));
        const canClaim = Boolean(nextStage && pts >= nextStage.points && isUnlocked);

        host.innerHTML = `
          <div class="event-banner-card fade-in">
            <div class="event-top-row">
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="pill-ice">❄️ ИВЕНТ «СНЕГОПАД»</span>
                ${isBeforeOfficialStart && isUnlocked ? `<span class="pill-gold-sm">ПРЕВЬЮ</span>` : ""}
              </div>
              <span class="event-timer-chip" id="eventCountdownChip">
                ${isBeforeOfficialStart ? `1 дек · ${formatCountdown(startTs - now)}` : "АКТИВЕН"}
              </span>
            </div>

            <div class="event-desc">
              ${isBeforeOfficialStart
                ? "1 декабря в 00:00 МСК появятся новые зимние кейсы (до 150 ★), «Тонкий лёд» и игра «Лавина»."
                : "1 снежинка за каждые 2 ★ оборота в кейсах, апгрейдере и «Лавине». Копи снежинки и забирай бонусы!"}
            </div>

            ${isUnlocked ? `
              <div class="ice-progress-wrap">
                <div class="ice-progress-bar">
                  <div class="ice-progress-fill" style="width:${pct}%;"></div>
                </div>
                <div class="ice-progress-meta">
                  <span>Снежинки: <b>${pts}</b> / ${nextStage ? nextStage.points : maxPts}</span>
                  <span>${nextStage ? `Этап ${nextStage.stage}: +${nextStage.reward_stars} ★` : "Все этапы пройдены"}</span>
                </div>
              </div>
            ` : ""}

            ${canClaim ? `<button type="button" class="btn-main" id="btnClaimEventStage" style="height:40px;min-height:40px;">Забрать награду этапа (+${nextStage.reward_stars} ★)</button>` : ""}
          </div>
        `;

        const claimBtn = document.getElementById("btnClaimEventStage");
        if (claimBtn) {
          claimBtn.onclick = async () => {
            claimBtn.disabled = true;
            try {
              const r = await fetch(apiUrl("/api/event_claim_stage"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData })
              });
              const d = await r.json();
              if (d.ok) {
                playWin();
                appState.event_claimed_stage = d.claimed_stage;
                appState.stars_balance = d.stars_balance;
                appState.wager_left = d.wager_left;
                appState.withdrawable_stars = d.withdrawable_stars;
                saveCache(appState);
                updateStarsDisplay(appState.stars_balance);
                renderEventSection();
                toast(`Получено +${d.reward_stars} ★ за этап снегопада!`);
              } else {
                claimBtn.disabled = false;
                toast(d.message || "Не удалось забрать награду");
              }
            } catch (_) {
              claimBtn.disabled = false;
              toast("Ошибка сети");
            }
          };
        }
      }

      function renderGamesHub() {
        const host = document.getElementById("gamesHubMount");
        if (!host || !appState) return;

        const isV2 = (appState.ui_version || "v1") === "v2";
        const now = Math.floor(Date.now() / 1000);
        const startTs = Number(appState.event_start_ts || 1796072400);
        const avalancheUnlocked = Boolean(appState.event_unlocked);
        const paidCasesCount = Array.isArray(appState.cases)
          ? appState.cases.filter((c) => !c.is_daily && c.id !== "daily").length
          : 4;

        if (!isV2) {
          host.innerHTML = `
            <div class="sec-row fade-in">
              <div class="sec-title">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <span>Игры</span>
              </div>
              <span class="sec-sub">Шанс до 65%</span>
            </div>

            <a class="upgrade-card-banner fade-in" href="cases.html">
              <div>
                <h3>Кейсы</h3>
                <p>Классические зимние кейсы с перекрутом дропа</p>
              </div>
              <div class="upgrade-badge-box">
                <img src="./cases_mode.png" onerror="this.onerror=null;this.src='./newyear.png';" style="width:22px;height:22px;object-fit:contain;" alt="" />
                <span>${paidCasesCount} шт.</span>
              </div>
            </a>

            <a class="upgrade-card-banner fade-in" href="upgrader.html">
              <div>
                <h3>Апгрейдер</h3>
                <p>Прокачай ставку в звёзды с выбором множителя</p>
              </div>
              <div class="upgrade-badge-box">
                <span>★</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="2.4">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                  <polyline points="12 5 19 12 12 19"/>
                </svg>
                <img src="./upgrader_mode.png" onerror="this.onerror=null;this.src='./ring.png';" style="width:22px;height:22px;object-fit:contain;" alt="" />
              </div>
            </a>
          `;
          return;
        }

        host.innerHTML = `
          <div class="sec-row fade-in">
            <div class="sec-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              <span>Игры</span>
            </div>
            <span class="sec-sub">Выбери режим</span>
          </div>

          <div class="games-tiles-grid-2 fade-in">
            <a class="game-tile-card tile-cases" href="cases.html">
              <div class="game-tile-art">
                <img src="./cases_mode.png" onerror="this.onerror=null;this.src='./newyear.png';" alt="Кейсы" />
              </div>
              <div class="game-tile-pill">${paidCasesCount} кейсов</div>
              <div class="game-tile-title">Кейсы</div>
            </a>

            <a class="game-tile-card tile-upgrader" href="upgrader.html">
              <div class="game-tile-art">
                <img src="./upgrader_mode.png" onerror="this.onerror=null;this.src='./ring.png';" alt="Апгрейдер" />
              </div>
              <div class="game-tile-pill">До 65%</div>
              <div class="game-tile-title">Апгрейдер</div>
            </a>

            <a class="game-tile-card tile-avalanche ${avalancheUnlocked ? "" : "is-locked"}" style="grid-column:1/-1;min-height:110px;flex-direction:row;padding:14px 18px;text-align:left;" href="${avalancheUnlocked ? "avalanche.html" : "#"}">
              <div style="display:flex;flex-direction:column;gap:5px;">
                <div class="game-tile-pill" style="align-self:flex-start;" id="avalancheTileBadge">
                  ${avalancheUnlocked ? "НОВЫЙ РЕЖИМ · ДО x25" : `ОТКРОЕТСЯ 1 ДЕК · ${formatCountdown(startTs - now)}`}
                </div>
                <div class="game-tile-title" style="font-size:17px;">Лавина</div>
                <div style="font-size:11.5px;color:#e0f2fe;opacity:0.85;">Жми «Забрать» вручную или настрой авто-выход до схода</div>
              </div>
              <div class="game-tile-art" style="width:64px;height:64px;">
                <img src="./avalanche.png" onerror="this.src=getFallbackSrc('rocket')" style="width:54px;height:54px;" alt="Лавина" />
              </div>
            </a>
          </div>
        `;
      }

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
          renderSubRow();
          renderDailyTimer();
          renderEventSection();
          renderGamesHub();
        }
      });

      if (!session) return;
      appState = session.state;

      renderSubRow();
      renderDailyTimer();
      renderEventSection();
      renderGamesHub();

      setInterval(() => {
        renderDailyTimer();
        if (appState) {
          const now = Math.floor(Date.now() / 1000);
          const startTs = Number(appState.event_start_ts || 1796072400);
          const chip = document.getElementById("eventCountdownChip");
          if (chip && now < startTs) {
            chip.textContent = `1 дек · ${formatCountdown(startTs - now)}`;
          }
          const avBadge = document.getElementById("avalancheTileBadge");
          if (avBadge && !appState.event_unlocked && now < startTs) {
            avBadge.textContent = `ОТКРОЕТСЯ 1 ДЕК · ${formatCountdown(startTs - now)}`;
          }
        }
      }, 1000);

      document.getElementById("subStatusPill").onclick = async () => {
        if (appState.is_subscribed) return;
        const url = `https://t.me/${GIFTEZ_CONFIG.CHANNEL_USERNAME}`;
        if (tg?.openTelegramLink) tg.openTelegramLink(url);
        else window.open(url, "_blank");

        if (tg?.initData) {
          setTimeout(async () => {
            const r = await fetch(apiUrl("/api/check_sub"), {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ initData: tg.initData })
            });
            const d = await r.json();
            if (d.ok) {
              appState.is_subscribed = Boolean(d.is_subscribed);
              saveCache(appState);
              renderSubRow();
            }
          }, 2500);
        }
      };
    })();
  </script>
</body>
</html>
