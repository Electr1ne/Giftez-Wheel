<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Апгрейдер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .upgrader-hero-card {
      background:
        radial-gradient(circle at 50% 18%, rgba(56, 189, 248, 0.16) 0%, transparent 60%),
        linear-gradient(180deg, #121c33 0%, #0b1120 100%);
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .dial-stage {
      position: relative;
      width: 262px;
      height: 262px;
      margin: 0 auto 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-ambient-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(125, 211, 252, 0.12);
      box-shadow: inset 0 0 32px rgba(56, 189, 248, 0.08);
      pointer-events: none;
    }

    .dial-center-disc {
      position: absolute;
      inset: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 25%, #182644 0%, #0a0f1c 100%);
      border: 1px solid rgba(148, 197, 255, 0.24);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.55),
        inset 0 0 24px rgba(56, 189, 248, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .dial-center-disc.spinning {
      transform: scale(1.03);
      box-shadow:
        0 12px 30px rgba(56, 189, 248, 0.26),
        inset 0 0 30px rgba(56, 189, 248, 0.28);
    }

    .dial-mult-big {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.6px;
      line-height: 1.05;
    }

    .dial-chance-sub {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Две карточки под барабаном */
    .duel-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .duel-card {
      position: relative;
      padding: 12px 10px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(15, 22, 38, 0.9) 100%);
      border: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 5px;
      min-height: 98px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      transition: border-color 0.16s ease, transform 0.14s ease;
    }

    .duel-card.interactive:active {
      transform: scale(0.98);
    }

    .duel-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .duel-stake-val {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 25px;
      font-weight: 900;
    }

    .duel-target-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
    }

    /* Вкладки Звёзды / Подарки */
    .up-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 15px;
      background: #070b14;
      border: 1px solid var(--border);
    }

    .up-tab-btn {
      height: 36px;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .up-tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(99, 102, 241, 0.24));
      color: #fff;
      border: 1px solid rgba(125, 211, 252, 0.35);
    }

    .stake-input-box {
      text-align: center;
      padding: 10px 12px;
      border-radius: 16px;
      background: #070b14;
      border: 1px solid var(--border-strong);
    }

    .stake-inline-input {
      width: 130px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }

    .quick-adj-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .targets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .gift-target-btn {
      padding: 10px;
      border-radius: 15px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
    }

    .gift-target-btn:active {
      transform: scale(0.97);
    }

    .gift-target-btn.active {
      border-color: var(--ice-bright);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.18));
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.24);
    }

    .gift-target-btn img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="sec-row fade-in">
      <a class="btn-mini-refresh" href="index.html">&lt; Назад</a>
      <span class="pill-ice">АПГРЕЙДЕР</span>
    </div>

    <div class="upgrader-hero-card fade-in">
      <!-- Двойной барабан с долгим плавным замедлением -->
      <div class="dial-stage">
        <div class="dial-ambient-ring"></div>
        <canvas id="upgradeDial" width="262" height="262"></canvas>
        <div class="dial-center-disc" id="dialCenterDisc">
          <div class="dial-mult-big" id="upMultText">x1.50</div>
          <div class="dial-chance-sub" id="upPctText">Шанс 60.0%</div>
        </div>
      </div>

      <!-- Две карточки: Ваша ставка | Цель апгрейда -->
      <div class="duel-cards">
        <div class="duel-card interactive" id="focusStakeCard" style="cursor:pointer;">
          <div class="duel-label">Ваша ставка</div>
          <div class="duel-stake-val">
            <span style="color:var(--ice-bright);">★</span>
            <span id="cardStakeNum">10</span>
          </div>
          <div class="row-sub" id="cardStakeSub">Нажми для ввода</div>
        </div>

        <div class="duel-card interactive" id="openTargetSheetCard" style="cursor:pointer;">
          <div class="duel-label">Цель апгрейда</div>
          <img class="duel-target-img" id="cardTargetImg" src="./bear.png" onerror="this.src=getFallbackSrc('bear')" alt="" />
          <div class="row-sub" id="cardTargetName">Мишка · 15 ★</div>
        </div>
      </div>

      <!-- Кнопка Апгрейд -->
      <button type="button" class="btn-main" id="btnRunUpgrade">Апгрейд</button>

      <!-- Вкладки Звёзды / Подарки -->
      <div class="up-tabs">
        <button type="button" class="up-tab-btn active" id="tabUpStars">Звёзды</button>
        <button type="button" class="up-tab-btn" id="tabUpGifts">Подарки</button>
      </div>

      <!-- Панель Звёзды -->
      <div id="paneUpStars" style="display:flex;flex-direction:column;gap:8px;">
        <div class="stake-input-box">
          <div class="row-sub" style="margin-bottom:4px;">Введите сумму ставки</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
            <span style="font-size:24px;font-weight:900;color:var(--ice-bright);">★</span>
            <input type="number" class="stake-inline-input" id="upBetInput" min="1" value="10" />
          </div>
        </div>

        <div class="quick-adj-row">
          <button type="button" class="btn-soft" id="btnMinus10">−10</button>
          <button type="button" class="btn-soft" id="btnPlus50">+50</button>
          <button type="button" class="btn-soft" id="btnMaxStake">MAX</button>
        </div>
      </div>

      <!-- Панель Подарки -->
      <div id="paneUpGifts" style="display:none;flex-direction:column;gap:8px;">
        <div class="row-sub">Выбери целевой подарок (выигрыш начисляется в ★ на баланс)</div>
        <div class="targets-grid" id="upTargetsGrid"></div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      const TARGETS = Object.values(GIFTS_CATALOG);

      let appState = null;
      let selected = TARGETS[0];
      let pointerDeg = 0;
      let pointerSpeed = 0;
      let flashColor = null;
      let busy = false;

      const canvas = document.getElementById("upgradeDial");
      const g = canvas.getContext("2d");

      function getBet() {
        return Math.max(1, Math.floor(Number(document.getElementById("upBetInput").value || 1)));
      }

      function getChance() {
        const bet = getBet();
        if (bet >= selected.stars) return 0;
        return Math.min(80, Math.max(1, Number(((bet / Math.max(1, selected.stars)) * 90).toFixed(1))));
      }

      function drawDial(pct, deg, speedNorm = 0) {
        const w = canvas.width;
        const cx = w / 2;
        const cy = w / 2;
        const outerR = 110;
        const innerR = 87;
        g.clearRect(0, 0, w, w);

        // Внешнее тёмное кольцо
        g.beginPath();
        g.arc(cx, cy, outerR, 0, Math.PI * 2);
        g.strokeStyle = "rgba(148, 197, 255, 0.1)";
        g.lineWidth = 15;
        g.stroke();

        // Внутреннее кольцо
        g.beginPath();
        g.arc(cx, cy, innerR, 0, Math.PI * 2);
        g.strokeStyle = "rgba(148, 197, 255, 0.07)";
        g.lineWidth = 12;
        g.stroke();

        // Деления по кругу
        for (let i = 0; i < 48; i++) {
          const a = (i * 7.5) * (Math.PI / 180);
          const isMajor = i % 4 === 0;
          const r1 = outerR + (isMajor ? 10 : 11);
          const r2 = outerR + (isMajor ? 16 : 14);
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
          g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
          g.strokeStyle = isMajor ? "rgba(186, 230, 253, 0.32)" : "rgba(148, 197, 255, 0.14)";
          g.lineWidth = isMajor ? 1.8 : 1.1;
          g.stroke();
        }

        // Светящаяся дуга шанса
        if (pct > 0) {
          const start = -Math.PI / 2;
          const end = start + (Math.PI * 2 * (pct / 100));
          const grad = g.createLinearGradient(cx - outerR, cy - outerR, cx + outerR, cy + outerR);
          if (flashColor) {
            grad.addColorStop(0, flashColor);
            grad.addColorStop(1, flashColor);
          } else {
            grad.addColorStop(0, "#38bdf8");
            grad.addColorStop(1, "#818cf8");
          }

          g.save();
          g.shadowColor = flashColor || "rgba(56, 189, 248, 0.55)";
          g.shadowBlur = 14;
          g.beginPath();
          g.arc(cx, cy, outerR, start, end);
          g.strokeStyle = grad;
          g.lineWidth = 15;
          g.lineCap = "round";
          g.stroke();
          g.restore();
        }

        // Световой шлейф за стрелкой при быстром вращении
        if (speedNorm > 0.04) {
          const tailSpan = Math.min(48, speedNorm * 52) * (Math.PI / 180);
          const headRad = (-90 + deg) * (Math.PI / 180);
          g.beginPath();
          g.arc(cx, cy, outerR, headRad - tailSpan, headRad);
          g.strokeStyle = `rgba(186, 230, 253, ${Math.min(0.45, speedNorm * 0.5)})`;
          g.lineWidth = 11;
          g.lineCap = "round";
          g.stroke();
        }

        // Неоново-ледяной указатель (стрелка)
        g.save();
        g.translate(cx, cy);
        g.rotate((deg * Math.PI) / 180);

        g.shadowColor = "rgba(125, 211, 252, 0.95)";
        g.shadowBlur = 16;

        g.beginPath();
        g.moveTo(0, -outerR + 19);
        g.lineTo(-10.5, -outerR - 6);
        g.quadraticCurveTo(0, -outerR - 15, 10.5, -outerR - 6);
        g.closePath();
        g.fillStyle = "#f8fafc";
        g.fill();

        g.beginPath();
        g.rect(-6.5, -outerR - 6, 13, 3.5);
        g.fillStyle = "#38bdf8";
        g.fill();

        g.restore();
      }

      function syncUI() {
        const bet = getBet();
        const pct = getChance();
        const mult = (selected.stars / bet).toFixed(2);

        document.getElementById("cardStakeNum").textContent = String(bet);
        document.getElementById("upMultText").textContent = `x${mult}`;
        document.getElementById("upPctText").textContent = `Шанс ${pct}%`;

        document.getElementById("cardTargetImg").src = getImageSrc(selected.icon);
        document.getElementById("cardTargetName").textContent = `${selected.name} · ${selected.stars} ★`;

        drawDial(pct, pointerDeg, pointerSpeed);
      }

      function renderTargets() {
        const grid = document.getElementById("upTargetsGrid");
        grid.innerHTML = TARGETS.map(
          (t) => `
            <button type="button" class="gift-target-btn ${t.id === selected.id ? "active" : ""}" data-tid="${t.id}">
              <img src="${getImageSrc(t.icon)}" onerror="this.src=getFallbackSrc('${t.id}')" alt="" />
              <div>
                <div class="row-title">${escapeHtml(t.name)}</div>
                <div class="row-sub">${t.stars} ★</div>
              </div>
            </button>
          `
        ).join("");

        grid.querySelectorAll("[data-tid]").forEach((btn) => {
          btn.onclick = () => {
            if (busy) return;
            const found = TARGETS.find((x) => x.id === btn.getAttribute("data-tid"));
            if (found) {
              selected = found;
              renderTargets();
              syncUI();
            }
          };
        });
      }

      // Плавная кривая: мягкий разгон в начале + долгое напряжённое замедление в конце
      function smoothUpgradeCurve(t) {
        const split = 0.18;
        const pIn = 2.0;
        const pOut = 5.2;
        const w1 = split / pIn;
        const w2 = (1 - split) / pOut;
        const sum = w1 + w2;
        if (t <= split) {
          return (w1 / sum) * Math.pow(t / split, pIn);
        }
        return 1 - (w2 / sum) * Math.pow((1 - t) / (1 - split), pOut);
      }

      function animatePointer(totalDeg) {
        return new Promise((resolve) => {
          const t0 = performance.now();
          const dur = 5800; // Дольше и плавнее замедление
          const pct = getChance();
          const startDeg = pointerDeg % 360;
          const deltaDeg = totalDeg - startDeg;
          let lastDeg = startDeg;
          let lastTickStep = Math.floor(startDeg / 18);

          document.getElementById("dialCenterDisc").classList.add("spinning");

          function step(now) {
            const p = Math.min(1, (now - t0) / dur);
            const eased = smoothUpgradeCurve(p);
            pointerDeg = startDeg + deltaDeg * eased;

            const instDelta = Math.max(0, pointerDeg - lastDeg);
            lastDeg = pointerDeg;
            pointerSpeed = Math.min(1, instDelta / 12);

            const tickStep = Math.floor(pointerDeg / 18);
            if (tickStep !== lastTickStep) {
              lastTickStep = tickStep;
              playTick();
              if (tg?.HapticFeedback && p > 0.06 && p < 0.97) {
                tg.HapticFeedback.selectionChanged();
              }
            }

            drawDial(pct, pointerDeg, pointerSpeed);

            if (p < 1) {
              requestAnimationFrame(step);
            } else {
              pointerSpeed = 0;
              drawDial(pct, pointerDeg, 0);
              document.getElementById("dialCenterDisc").classList.remove("spinning");
              resolve();
            }
          }
          requestAnimationFrame(step);
        });
      }

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
        }
      });
      if (!session) return;
      appState = session.state;

      renderTargets();
      syncUI();

      function showTab(mode) {
        document.getElementById("tabUpStars").classList.toggle("active", mode === "stars");
        document.getElementById("tabUpGifts").classList.toggle("active", mode === "gifts");
        document.getElementById("paneUpStars").style.display = mode === "stars" ? "flex" : "none";
        document.getElementById("paneUpGifts").style.display = mode === "gifts" ? "flex" : "none";
      }

      document.getElementById("tabUpStars").onclick = () => showTab("stars");
      document.getElementById("tabUpGifts").onclick = () => showTab("gifts");
      document.getElementById("openTargetSheetCard").onclick = () => showTab("gifts");
      document.getElementById("focusStakeCard").onclick = () => {
        showTab("stars");
        document.getElementById("upBetInput").focus();
      };

      document.getElementById("upBetInput").oninput = syncUI;

      document.getElementById("btnMinus10").onclick = () => {
        if (busy) return;
        const cur = getBet();
        document.getElementById("upBetInput").value = String(Math.max(1, cur - 10));
        syncUI();
      };

      document.getElementById("btnPlus50").onclick = () => {
        if (busy) return;
        const cur = getBet();
        const cap = Math.max(1, selected.stars - 1);
        document.getElementById("upBetInput").value = String(Math.min(cap, cur + 50));
        syncUI();
      };

      document.getElementById("btnMaxStake").onclick = () => {
        if (busy) return;
        const bal = Math.max(1, Number(appState.stars_balance || 0));
        const cap = Math.max(1, selected.stars - 1);
        document.getElementById("upBetInput").value = String(Math.min(bal, cap));
        syncUI();
      };

      document.getElementById("btnRunUpgrade").onclick = async () => {
        if (busy) return;
        const bet = getBet();
        if (bet >= selected.stars) {
          toast("Выбери цель дороже твоей ставки");
          showTab("gifts");
          return;
        }
        if (!tg?.initData) {
          toast("Открой в Telegram");
          return;
        }

        busy = true;
        flashColor = null;
        const btn = document.getElementById("btnRunUpgrade");
        btn.disabled = true;

        try {
          const r = await fetch(apiUrl("/api/upgrade_spin"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              bet_stars: bet,
              target_id: selected.id
            })
          });
          const d = await r.json();
          if (!d.ok) {
            busy = false;
            btn.disabled = false;
            toast(d.message || "Ошибка апгрейда");
            return;
          }

          // 8 полных оборотов + точный сектор выпадения для длинного напряжённого докрута
          const finalDeg = 360 * 8 + (Number(d.roll || 50) / 100) * 360;
          await animatePointer(finalDeg);

          appState.stars_balance = d.stars_balance;
          appState.wager_left = d.wager_left;
          appState.withdrawable_stars = d.withdrawable_stars;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          busy = false;
          btn.disabled = false;

          if (d.won) {
            flashColor = "#7dd3fc";
            syncUI();
            playWin();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            toast(`Апгрейд успешен! +${selected.stars} ★ на баланс`);
          } else {
            flashColor = "#f43f5e";
            syncUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
            toast("Апгрейд не зашёл");
          }
        } catch (_) {
          busy = false;
          btn.disabled = false;
          toast("Ошибка сети");
        }
      };
    })();
  </script>
</body>
</html>
