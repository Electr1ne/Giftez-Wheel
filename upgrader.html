<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Апгрейдер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .dial-stage {
      position: relative;
      width: 248px;
      height: 248px;
      margin: 2px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-center-disc {
      position: absolute;
      inset: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #131c31 0%, #0b101d 100%);
      border: 1px solid var(--border-strong);
      box-shadow: inset 0 0 22px rgba(56, 189, 248, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .dial-mult-big {
      font-size: 30px;
      font-weight: 900;
      color: var(--ice-bright);
      letter-spacing: -0.5px;
      line-height: 1.05;
    }

    .dial-chance-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Две карточки под барабаном как на референсе */
    .duel-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .duel-card {
      padding: 12px 10px;
      border-radius: 18px;
      background: var(--panel-2);
      border: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      min-height: 92px;
    }

    .duel-label {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 700;
    }

    .duel-stake-val {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 24px;
      font-weight: 900;
    }

    .duel-target-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    /* Вкладки Звёзды / Подарки */
    .up-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 14px;
      background: #080c16;
      border: 1px solid var(--border);
    }

    .up-tab-btn {
      height: 36px;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .up-tab-btn.active {
      background: var(--panel-3);
      color: #fff;
    }

    .stake-input-box {
      text-align: center;
      padding: 8px 10px;
      border-radius: 16px;
      background: #080c16;
      border: 1px solid var(--border);
    }

    .stake-inline-input {
      width: 120px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      outline: none;
    }

    .quick-adj-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .targets-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .gift-target-btn {
      padding: 10px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-align: left;
    }

    .gift-target-btn.active {
      border-color: var(--ice-bright);
      background: var(--ice-soft);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.24);
    }

    .gift-target-btn img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="sec-row fade-in">
      <a class="btn-mini-refresh" href="index.html">&lt; Назад</a>
      <span class="pill-ice">АПГРЕЙДЕР</span>
    </div>

    <div class="section-card fade-in">
      <!-- Двойной барабан с ледяным указателем сверху как на референсе -->
      <div class="dial-stage">
        <canvas id="upgradeDial" width="248" height="248"></canvas>
        <div class="dial-center-disc">
          <div class="dial-mult-big" id="upMultText">x1.50</div>
          <div class="dial-chance-sub" id="upPctText">Шанс 60.0%</div>
        </div>
      </div>

      <!-- Две карточки: Ваша ставка | Цель апгрейда -->
      <div class="duel-cards">
        <div class="duel-card">
          <div class="duel-label">Ваша ставка</div>
          <div class="duel-stake-val">
            <span style="color:var(--ice-bright);">★</span>
            <span id="cardStakeNum">10</span>
          </div>
        </div>
        <div class="duel-card" id="openTargetSheetCard" style="cursor:pointer;">
          <div class="duel-label">Цель апгрейда</div>
          <img class="duel-target-img" id="cardTargetImg" src="./bear.png" onerror="this.src=getFallbackSrc('bear')" alt="" />
          <div class="row-sub" id="cardTargetName">Мишка · 15 ★</div>
        </div>
      </div>

      <!-- Кнопка Апгрейд -->
      <button type="button" class="btn-main" id="btnRunUpgrade">Апгрейд</button>

      <!-- Вкладки Звёзды / Подарки -->
      <div class="up-tabs">
        <button type="button" class="up-tab-btn active" id="tabUpStars">Звёзды</button>
        <button type="button" class="up-tab-btn" id="tabUpGifts">Подарки</button>
      </div>

      <!-- Панель Звёзды -->
      <div id="paneUpStars" style="display:flex;flex-direction:column;gap:8px;">
        <div class="stake-input-box">
          <div class="row-sub" style="margin-bottom:4px;">Введите сумму ставки</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
            <span style="font-size:22px;font-weight:900;color:var(--ice-bright);">★</span>
            <input type="number" class="stake-inline-input" id="upBetInput" min="1" value="10" />
          </div>
        </div>

        <div class="quick-adj-row">
          <button type="button" class="btn-soft" id="btnMinus10">−10</button>
          <button type="button" class="btn-soft" id="btnPlus50">+50</button>
          <button type="button" class="btn-soft" id="btnMaxStake">MAX</button>
        </div>
      </div>

      <!-- Панель Подарки (выбор цели апгрейда) -->
      <div id="paneUpGifts" style="display:none;flex-direction:column;gap:8px;">
        <div class="row-sub">Выбери целевой подарок (выигрыш зачисляется в ★ на баланс)</div>
        <div class="targets-grid" id="upTargetsGrid"></div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      const TARGETS = Object.values(GIFTS_CATALOG);

      let appState = null;
      let selected = TARGETS[0];
      let pointerDeg = 0;
      let flashColor = null;
      let busy = false;

      const canvas = document.getElementById("upgradeDial");
      const g = canvas.getContext("2d");

      function getBet() {
        return Math.max(1, Math.floor(Number(document.getElementById("upBetInput").value || 1)));
      }

      function getChance() {
        const bet = getBet();
        if (bet >= selected.stars) return 0;
        return Math.min(80, Math.max(1, Number(((bet / Math.max(1, selected.stars)) * 90).toFixed(1))));
      }

      function drawDial(pct, deg) {
        const w = canvas.width;
        const cx = w / 2;
        const cy = w / 2;
        const outerR = 104;
        const innerR = 82;
        g.clearRect(0, 0, w, w);

        // Внешнее тёмное кольцо
        g.beginPath();
        g.arc(cx, cy, outerR, 0, Math.PI * 2);
        g.strokeStyle = "rgba(148, 197, 255, 0.11)";
        g.lineWidth = 14;
        g.stroke();

        // Внутреннее кольцо
        g.beginPath();
        g.arc(cx, cy, innerR, 0, Math.PI * 2);
        g.strokeStyle = "rgba(148, 197, 255, 0.08)";
        g.lineWidth = 12;
        g.stroke();

        // Ледяная дуга шанса успеха (от -90° по часовой)
        if (pct > 0) {
          const start = -Math.PI / 2;
          const end = start + (Math.PI * 2 * (pct / 100));
          g.beginPath();
          g.arc(cx, cy, outerR, start, end);
          g.strokeStyle = flashColor || "#38bdf8";
          g.lineWidth = 14;
          g.lineCap = "round";
          g.stroke();
        }

        // Неоново-ледяной указатель (стрелка)
        g.save();
        g.translate(cx, cy);
        g.rotate((deg * Math.PI) / 180);

        g.shadowColor = "rgba(125, 211, 252, 0.85)";
        g.shadowBlur = 14;

        g.beginPath();
        g.moveTo(0, -outerR + 18);
        g.lineTo(-10, -outerR - 6);
        g.quadraticCurveTo(0, -outerR - 14, 10, -outerR - 6);
        g.closePath();
        g.fillStyle = "#f8fafc";
        g.fill();

        // Ледяная полоска на указателе как на референсе
        g.beginPath();
        g.rect(-6, -outerR - 6, 12, 3.5);
        g.fillStyle = "#38bdf8";
        g.fill();

        g.restore();
      }

      function syncUI() {
        const bet = getBet();
        const pct = getChance();
        const mult = (selected.stars / bet).toFixed(2);

        document.getElementById("cardStakeNum").textContent = String(bet);
        document.getElementById("upMultText").textContent = `x${mult}`;
        document.getElementById("upPctText").textContent = `Шанс ${pct}%`;

        document.getElementById("cardTargetImg").src = getImageSrc(selected.icon);
        document.getElementById("cardTargetName").textContent = `${selected.name} · ${selected.stars} ★`;

        drawDial(pct, pointerDeg);
      }

      function renderTargets() {
        const grid = document.getElementById("upTargetsGrid");
        grid.innerHTML = TARGETS.map(
          (t) => `
            <button type="button" class="gift-target-btn ${t.id === selected.id ? "active" : ""}" data-tid="${t.id}">
              <img src="${getImageSrc(t.icon)}" onerror="this.src=getFallbackSrc('${t.id}')" alt="" />
              <div>
                <div class="row-title">${escapeHtml(t.name)}</div>
                <div class="row-sub">${t.stars} ★</div>
              </div>
            </button>
          `
        ).join("");

        grid.querySelectorAll("[data-tid]").forEach((btn) => {
          btn.onclick = () => {
            if (busy) return;
            const found = TARGETS.find((x) => x.id === btn.getAttribute("data-tid"));
            if (found) {
              selected = found;
              renderTargets();
              syncUI();
            }
          };
        });
      }

      function animatePointer(totalDeg) {
        return new Promise((resolve) => {
          const t0 = performance.now();
          const dur = 3400;
          const pct = getChance();
          let lastTickStep = 0;

          function step(now) {
            const p = Math.min(1, (now - t0) / dur);
            const ease = 1 - Math.pow(1 - p, 3.8);
            pointerDeg = totalDeg * ease;
            const tickStep = Math.floor(pointerDeg / 20);
            if (tickStep !== lastTickStep) {
              lastTickStep = tickStep;
              playTick();
              if (tg?.HapticFeedback && p > 0.08 && p < 0.95) {
                tg.HapticFeedback.selectionChanged();
              }
            }
            drawDial(pct, pointerDeg);
            if (p < 1) requestAnimationFrame(step);
            else resolve();
          }
          requestAnimationFrame(step);
        });
      }

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
        }
      });
      if (!session) return;
      appState = session.state;

      renderTargets();
      syncUI();

      function showTab(mode) {
        document.getElementById("tabUpStars").classList.toggle("active", mode === "stars");
        document.getElementById("tabUpGifts").classList.toggle("active", mode === "gifts");
        document.getElementById("paneUpStars").style.display = mode === "stars" ? "flex" : "none";
        document.getElementById("paneUpGifts").style.display = mode === "gifts" ? "flex" : "none";
      }

      document.getElementById("tabUpStars").onclick = () => showTab("stars");
      document.getElementById("tabUpGifts").onclick = () => showTab("gifts");
      document.getElementById("openTargetSheetCard").onclick = () => showTab("gifts");

      document.getElementById("upBetInput").oninput = syncUI;

      document.getElementById("btnMinus10").onclick = () => {
        if (busy) return;
        const cur = getBet();
        document.getElementById("upBetInput").value = String(Math.max(1, cur - 10));
        syncUI();
      };

      document.getElementById("btnPlus50").onclick = () => {
        if (busy) return;
        const cur = getBet();
        const cap = Math.max(1, selected.stars - 1);
        document.getElementById("upBetInput").value = String(Math.min(cap, cur + 50));
        syncUI();
      };

      document.getElementById("btnMaxStake").onclick = () => {
        if (busy) return;
        const bal = Math.max(1, Number(appState.stars_balance || 0));
        const cap = Math.max(1, selected.stars - 1);
        document.getElementById("upBetInput").value = String(Math.min(bal, cap));
        syncUI();
      };

      document.getElementById("btnRunUpgrade").onclick = async () => {
        if (busy) return;
        const bet = getBet();
        if (bet >= selected.stars) {
          toast("Выбери цель дороже твоей ставки");
          showTab("gifts");
          return;
        }
        if (!tg?.initData) {
          toast("Открой в Telegram");
          return;
        }

        busy = true;
        flashColor = null;
        const btn = document.getElementById("btnRunUpgrade");
        btn.disabled = true;

        try {
          const r = await fetch(apiUrl("/api/upgrade_spin"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              initData: tg.initData,
              bet_stars: bet,
              target_id: selected.id
            })
          });
          const d = await r.json();
          if (!d.ok) {
            busy = false;
            btn.disabled = false;
            toast(d.message || "Ошибка апгрейда");
            return;
          }

          const finalDeg = 360 * 6 + (Number(d.roll || 50) / 100) * 360;
          await animatePointer(finalDeg);

          appState.stars_balance = d.stars_balance;
          appState.wager_left = d.wager_left;
          appState.withdrawable_stars = d.withdrawable_stars;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          busy = false;
          btn.disabled = false;

          if (d.won) {
            flashColor = "#7dd3fc";
            syncUI();
            playWin();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            toast(`Апгрейд успешен! +${selected.stars} ★ на баланс`);
          } else {
            flashColor = "#f43f5e";
            syncUI();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
            toast("Апгрейд не зашёл");
          }
        } catch (_) {
          busy = false;
          btn.disabled = false;
          toast("Ошибка сети");
        }
      };
    })();
  </script>
</body>
</html>
