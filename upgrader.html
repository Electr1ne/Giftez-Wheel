<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Апгрейдер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .dial-box {
      position: relative;
      width: 236px;
      height: 236px;
      margin: 4px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dial-inner {
      position: absolute;
      inset: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #15213b 0%, #0b101d 100%);
      border: 1px solid var(--border-strong);
      box-shadow: inset 0 0 24px rgba(56, 189, 248, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .dial-pct {
      font-size: 31px;
      font-weight: 900;
      color: var(--ice-bright);
      line-height: 1.1;
    }

    .dial-mult {
      font-size: 11px;
      font-weight: 800;
      color: #fde047;
      margin-top: 2px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 13px;
      background: #0a0e18;
      border: 1px solid var(--border);
    }

    .mode-tab-btn {
      height: 34px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-tab-btn.active {
      background: var(--ice-soft);
      color: var(--ice-bright);
      border: 1px solid var(--ice-border);
    }

    .qbet-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .inv-pick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .target-card {
      padding: 10px 11px;
      border-radius: 14px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-align: left;
    }

    .target-card.active {
      border-color: var(--ice-bright);
      background: var(--ice-soft);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.22);
    }

    .target-card img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="sec-row fade-in">
      <a class="btn-mini-refresh" href="./index.html" id="backHomeBtn">&lt; На главную</a>
      <span class="pill-ice">АПГРЕЙДЕР</span>
    </div>

    <div class="section-card fade-in">
      <div class="dial-box">
        <canvas id="upgradeDial" width="236" height="236"></canvas>
        <div class="dial-inner">
          <div class="dial-pct" id="upPctText">30%</div>
          <div class="dial-mult" id="upMultText">x3.00</div>
          <div class="row-sub" id="upSubText">Шанс успеха</div>
        </div>
      </div>

      <!-- Переключатель: ставка звёздами или подарком из инвентаря -->
      <div class="mode-switch">
        <button type="button" class="mode-tab-btn active" id="tabModeStars">Звёздами (★)</button>
        <button type="button" class="mode-tab-btn" id="tabModeItems">Подарком из инвентаря</button>
      </div>

      <!-- Блок ставки звёздами -->
      <div id="starsStakePanel" style="display:flex;flex-direction:column;gap:8px;">
        <input type="number" class="field-input" id="upBetInput" min="1" value="5" placeholder="Ставка в звёздах" />
        <div class="qbet-row">
          <button type="button" class="btn-soft" data-qbet="1" style="height:34px;min-height:34px;font-size:11.5px;padding:0;">1 ★</button>
          <button type="button" class="btn-soft" data-qbet="5" style="height:34px;min-height:34px;font-size:11.5px;padding:0;">5 ★</button>
          <button type="button" class="btn-soft" data-qbet="15" style="height:34px;min-height:34px;font-size:11.5px;padding:0;">15 ★</button>
          <button type="button" class="btn-soft" id="btnHalfStars" style="height:34px;min-height:34px;font-size:11.5px;padding:0;">50%</button>
          <button type="button" class="btn-soft" id="btnMaxStars" style="height:34px;min-height:34px;font-size:11.5px;padding:0;">MAX</button>
        </div>
      </div>

      <!-- Блок выбора подарка из инвентаря -->
      <div id="itemsStakePanel" style="display:none;flex-direction:column;gap:8px;">
        <div class="inv-pick-grid" id="upInvPickGrid"></div>
      </div>

      <div class="card-head" style="margin-top:2px;">
        <h2 style="font-size:14.5px;">Цель апгрейда</h2>
        <span class="row-sub">Шанс от 1% до 80%</span>
      </div>
      <div class="grid-2" id="upTargetsGrid"></div>

      <button type="button" class="btn-main" id="btnRunUpgrade">Прокачать</button>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      const TARGETS = [
        { id: "bear", name: "Мишка", stars: 15 },
        { id: "rose", name: "Роза", stars: 25 },
        { id: "giftbox", name: "Коробка", stars: 25 },
        { id: "rocket", name: "Ракета", stars: 50 },
        { id: "ring", name: "Кольцо", stars: 100 }
      ];

      let appState = null;
      let stakeMode = "stars"; // "stars" | "item"
      let selectedItemId = null;
      let selected = TARGETS[0];
      let pointerDeg = 0;
      let dialFlashColor = null;
      let busy = false;

      const canvas = document.getElementById("upgradeDial");
      const g = canvas.getContext("2d");

      document.getElementById("backHomeBtn").onclick = (e) => {
        e.preventDefault();
        navigateToPage("index.html");
      };

      function getStakeStars() {
        if (stakeMode === "item") {
          const items = (appState && appState.inventory_items) || [];
          const found = items.find((x) => x.id === selectedItemId);
          if (!found) return 0;
          return Number((PRIZE_META[found.prize] || {}).stars || found.stars || 0);
        }
        return Math.max(1, Math.floor(Number(document.getElementById("upBetInput").value || 1)));
      }

      function getChance() {
        const stake = getStakeStars();
        if (stake <= 0 || stake >= selected.stars) return 0;
        return Math.min(80, Math.max(1, Number(((stake / Math.max(1, selected.stars)) * 90).toFixed(1))));
      }

      function drawDial(pct, deg) {
        const w = canvas.width;
        const cx = w / 2;
        const cy = w / 2;
        const r = w / 2 - 16;
        g.clearRect(0, 0, w, w);

        // Внешние риски
        for (let i = 0; i < 36; i++) {
          const a = (i * 10) * (Math.PI / 180);
          const x1 = cx + Math.cos(a) * (r + 10);
          const y1 = cy + Math.sin(a) * (r + 10);
          const x2 = cx + Math.cos(a) * (r + 14);
          const y2 = cy + Math.sin(a) * (r + 14);
          g.beginPath();
          g.moveTo(x1, y1);
          g.lineTo(x2, y2);
          g.strokeStyle = "rgba(148, 197, 255, 0.2)";
          g.lineWidth = 1.5;
          g.stroke();
        }

        // Фоновый круг
        g.beginPath();
        g.arc(cx, cy, r, 0, Math.PI * 2);
        g.strokeStyle = "rgba(148, 197, 255, 0.12)";
        g.lineWidth = 14;
        g.stroke();

        // Сектор шанса победы
        if (pct > 0) {
          const start = -Math.PI / 2;
          const end = start + (Math.PI * 2 * (pct / 100));
          g.beginPath();
          g.arc(cx, cy, r, start, end);
          g.strokeStyle = dialFlashColor || "#38bdf8";
          g.lineWidth = 14;
          g.lineCap = "round";
          g.stroke();
        }

        // Бегущий указатель
        const rad = (-90 + deg) * (Math.PI / 180);
        const px = cx + Math.cos(rad) * r;
        const py = cy + Math.sin(rad) * r;

        g.beginPath();
        g.arc(px, py, 9, 0, Math.PI * 2);
        g.fillStyle = "rgba(253, 224, 71, 0.3)";
        g.fill();

        g.beginPath();
        g.arc(px, py, 5.5, 0, Math.PI * 2);
        g.fillStyle = "#fde047";
        g.fill();
      }

      function syncDial() {
        const stake = getStakeStars();
        const pct = getChance();
        const mult = stake > 0 ? (selected.stars / stake).toFixed(2) : "0.00";
        document.getElementById("upPctText").textContent = `${pct}%`;
        document.getElementById("upMultText").textContent = `x${mult}`;
        drawDial(pct, pointerDeg);
      }

      function renderInventoryPicker() {
        const grid = document.getElementById("upInvPickGrid");
        const items = (appState && Array.isArray(appState.inventory_items)) ? appState.inventory_items : [];
        if (!items.length) {
          selectedItemId = null;
          grid.innerHTML = `<div class="empty-box" style="grid-column:1/-1;padding:14px;">В инвентаре нет подарков для апгрейда</div>`;
          return;
        }
        if (!selectedItemId || !items.some((x) => x.id === selectedItemId)) {
          selectedItemId = items[0].id;
        }
        grid.innerHTML = items
          .map((it) => {
            const meta = PRIZE_META[it.prize] || { name: it.name || it.prize, stars: it.stars || 0 };
            return `
              <button type="button" class="target-card ${it.id === selectedItemId ? "active" : ""}" data-inv-pick="${escapeHtml(it.id)}">
                <img src="${getImageSrc(it.prize)}" onerror="this.src=getFallbackSrc('${escapeHtml(it.prize)}')" alt="" />
                <div>
                  <div class="row-title">${escapeHtml(meta.name)}</div>
                  <div class="row-sub">${meta.stars} ★</div>
                </div>
              </button>
            `;
          })
          .join("");

        grid.querySelectorAll("[data-inv-pick]").forEach((btn) => {
          btn.onclick = () => {
            if (busy) return;
            selectedItemId = btn.getAttribute("data-inv-pick");
            renderInventoryPicker();
            syncDial();
          };
        });
      }

      function renderTargets() {
        const grid = document.getElementById("upTargetsGrid");
        grid.innerHTML = TARGETS.map(
          (t) => `
            <button type="button" class="target-card ${t.id === selected.id ? "active" : ""}" data-tid="${t.id}">
              <img src="${getImageSrc(t.id)}" onerror="this.src=getFallbackSrc('${t.id}')" alt="" />
              <div>
                <div class="row-title">${escapeHtml(t.name)}</div>
                <div class="row-sub">${t.stars} ★</div>
              </div>
            </button>
          `
        ).join("");

        grid.querySelectorAll("[data-tid]").forEach((btn) => {
          btn.onclick = () => {
            if (busy) return;
            const found = TARGETS.find((x) => x.id === btn.getAttribute("data-tid"));
            if (found) {
              selected = found;
              renderTargets();
              syncDial();
            }
          };
        });
      }

      function switchStakeMode(mode) {
        if (busy) return;
        stakeMode = mode;
        document.getElementById("tabModeStars").classList.toggle("active", mode === "stars");
        document.getElementById("tabModeItems").classList.toggle("active", mode === "item");
        document.getElementById("starsStakePanel").style.display = mode === "stars" ? "flex" : "none";
        document.getElementById("itemsStakePanel").style.display = mode === "item" ? "flex" : "none";
        if (mode === "item") renderInventoryPicker();
        syncDial();
      }

      function animatePointer(totalDeg) {
        return new Promise((resolve) => {
          const t0 = performance.now();
          const dur = 3200;
          const pct = getChance();
          let lastTickStep = 0;

          function step(now) {
            const p = Math.min(1, (now - t0) / dur);
            const ease = 1 - Math.pow(1 - p, 3.8);
            pointerDeg = totalDeg * ease;
            const tickStep = Math.floor(pointerDeg / 22);
            if (tickStep !== lastTickStep) {
              lastTickStep = tickStep;
              playTick();
              if (tg?.HapticFeedback && p > 0.08 && p < 0.95) {
                tg.HapticFeedback.selectionChanged();
              }
            }
            drawDial(pct, pointerDeg);
            if (p < 1) requestAnimationFrame(step);
            else resolve();
          }
          requestAnimationFrame(step);
        });
      }

      const session = initGiftezPage("home", {
        onStateReady(fresh) {
          appState = fresh;
          if (stakeMode === "item") renderInventoryPicker();
          syncDial();
        }
      });
      if (!session) return;
      appState = session.state;

      renderTargets();
      syncDial();

      document.getElementById("tabModeStars").onclick = () => switchStakeMode("stars");
      document.getElementById("tabModeItems").onclick = () => switchStakeMode("item");
      document.getElementById("upBetInput").oninput = syncDial;

      document.querySelectorAll("[data-qbet]").forEach((b) => {
        b.onclick = () => {
          if (busy) return;
          document.getElementById("upBetInput").value = b.getAttribute("data-qbet");
          syncDial();
        };
      });
      document.getElementById("btnHalfStars").onclick = () => {
        if (busy) return;
        const half = Math.max(1, Math.floor(Number(appState.stars_balance || 0) / 2));
        document.getElementById("upBetInput").value = half;
        syncDial();
      };
      document.getElementById("btnMaxStars").onclick = () => {
        if (busy) return;
        const maxSafe = Math.max(1, Math.min(Number(appState.stars_balance || 0), Math.floor(selected.stars * 0.88)));
        document.getElementById("upBetInput").value = maxSafe;
        syncDial();
      };

      document.getElementById("btnRunUpgrade").onclick = async () => {
        if (busy) return;
        if (!tg?.initData) {
          toast("Открой в Telegram");
          return;
        }

        const stake = getStakeStars();
        if (stake <= 0) {
          toast(stakeMode === "item" ? "Выбери подарок из инвентаря" : "Укажи ставку от 1 ★");
          return;
        }
        if (stake >= selected.stars) {
          toast("Выбери цель дороже твоей ставки");
          return;
        }

        busy = true;
        dialFlashColor = null;
        const btn = document.getElementById("btnRunUpgrade");
        btn.disabled = true;
        document.getElementById("upSubText").textContent = "Прокачка...";

        try {
          const payload = stakeMode === "item"
            ? { initData: tg.initData, mode: "item", source_item_id: selectedItemId, target_id: selected.id }
            : { initData: tg.initData, mode: "stars", bet_stars: stake, target_id: selected.id };

          const r = await fetch(apiUrl("/api/upgrade_spin"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const d = await r.json();
          if (!d.ok) {
            busy = false;
            btn.disabled = false;
            document.getElementById("upSubText").textContent = "Шанс успеха";
            toast(d.message || "Ошибка апгрейда");
            return;
          }

          const finalAngle = 360 * 6 + (Number(d.roll || 50) / 100) * 360;
          await animatePointer(finalAngle);

          appState.stars_balance = d.stars_balance;
          updateStarsDisplay(appState.stars_balance);
          saveCache(appState);

          busy = false;
          btn.disabled = false;

          if (d.won) {
            dialFlashColor = "#34d399";
            syncDial();
            playWin();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
            document.getElementById("upSubText").textContent = "Успех!";
            toast(`Апгрейд прошёл! ${selected.name} в инвентаре`);
          } else {
            dialFlashColor = "#ef4444";
            syncDial();
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
            document.getElementById("upSubText").textContent = "Не повезло";
            toast("Апгрейд не зашёл");
          }

          await session.syncFromServer();
          if (stakeMode === "item") renderInventoryPicker();
        } catch (_) {
          busy = false;
          btn.disabled = false;
          document.getElementById("upSubText").textContent = "Шанс успеха";
          toast("Ошибка сети");
        }
      };
    })();
  </script>
</body>
</html>
