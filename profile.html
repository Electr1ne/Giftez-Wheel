<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Профиль</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="section-card fade-in">
      <div class="card-head">
        <div>
          <h2 id="profUserName">Игрок</h2>
          <div class="row-sub" id="profUserHandle">@username</div>
        </div>
        <span class="pill-ice" id="profRoleTag">Игрок</span>
      </div>

      <div class="grid-2">
        <div class="note-box">
          <div style="font-size:18px;font-weight:900;color:#fde047;" id="profStarsVal">0 ★</div>
          <div>Баланс звёзд</div>
        </div>
        <div class="note-box">
          <div style="font-size:18px;font-weight:900;color:#f1f5f9;" id="profSpinsVal">0</div>
          <div>Открыто кейсов</div>
        </div>
      </div>
    </div>

    <div class="section-card fade-in">
      <div class="card-head">
        <h2>Промокод</h2>
        <span class="row-sub">Бонус на баланс</span>
      </div>
      <input type="text" class="field-input" id="promoInput" placeholder="Введи промокод" autocomplete="off" />
      <button type="button" class="btn-main" id="promoActivateBtn">Активировать промокод</button>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;

      function syncProfile() {
        const u = tg?.initDataUnsafe?.user;
        document.getElementById("profUserName").textContent = u?.first_name || "Игрок";
        document.getElementById("profUserHandle").textContent = u?.username ? `@${u.username} · ID ${u.id}` : "Telegram Mini App";
        if (appState) {
          document.getElementById("profRoleTag").textContent = appState.is_admin ? "ADMIN" : "Игрок";
          document.getElementById("profStarsVal").textContent = `${Number(appState.stars_balance || 0)} ★`;
          document.getElementById("profSpinsVal").textContent = String(Number(appState.total_spins || 0));
        }
      }

      const session = initGiftezPage("profile", {
        onStateReady(fresh) {
          appState = fresh;
          syncProfile();
        }
      });
      if (!session) return;
      appState = session.state;
      syncProfile();

      document.getElementById("promoActivateBtn").onclick = async () => {
        const inp = document.getElementById("promoInput");
        const code = inp.value.trim();
        if (!code) {
          toast("Введи промокод");
          return;
        }
        if (!tg?.initData) {
          toast("Открой в Telegram");
          return;
        }
        try {
          const r = await fetch(apiUrl("/api/promo_redeem"), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: tg.initData, code })
          });
          const d = await r.json();
          if (d.ok) {
            playWin();
            inp.value = "";
            appState.stars_balance = d.stars_balance;
            saveCache(appState);
            updateStarsDisplay(appState.stars_balance);
            syncProfile();
            toast(d.message || "Промокод активирован!");
          } else {
            toast(d.message || "Не удалось активировать");
          }
        } catch (_) {
          toast("Ошибка сети");
        }
      };
    })();
  </script>
</body>
</html>
