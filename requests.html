<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GiftezUp — Выводы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <div id="headerMount"></div>

    <div class="section-card fade-in">
      <div class="card-head">
        <h2>Заявки на вывод</h2>
        <button type="button" class="btn-mini-refresh" id="reloadReqsBtn">Обновить</button>
      </div>
      <div class="note-box">
        Вывод оформляется через кнопку <b>«Кошелёк» → «Вывод»</b> ровными пакетами: <b>15 ★ → 13 ★</b>, <b>25 ★ → 21 ★</b>, <b>50 ★ → 43 ★</b>, <b>100 ★ → 85 ★</b>.
      </div>
      <div class="items-stack" id="requestsStack"></div>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    (function () {
      let appState = null;

      function renderRequests() {
        if (!appState) return;
        const list = Array.isArray(appState.my_requests) ? appState.my_requests : [];
        const wrap = document.getElementById("requestsStack");

        if (!list.length) {
          wrap.innerHTML = `<div class="empty-box">Заявок на вывод пока нет</div>`;
          return;
        }

        wrap.innerHTML = list
          .map((req) => {
            const isDone = req.status === "done";
            return `
              <div class="list-row">
                <div>
                  <div class="row-title">${Number(req.cost_stars)} ★ → к выдаче ${Number(req.payout_stars)} ★</div>
                  <div class="row-sub">${escapeHtml(req.breakdown || "")} · @${escapeHtml(req.username)}</div>
                </div>
                <span class="req-badge ${isDone ? "done" : "processing"}">${isDone ? "Выполнено" : "В обработке"}</span>
              </div>
            `;
          })
          .join("");
      }

      const session = initGiftezPage("requests", {
        onStateReady(fresh) {
          appState = fresh;
          renderRequests();
        }
      });
      if (!session) return;
      appState = session.state;
      renderRequests();

      document.getElementById("reloadReqsBtn").onclick = async () => {
        await session.syncFromServer();
        toast("Список обновлён");
      };
    })();
  </script>
</body>
</html>
